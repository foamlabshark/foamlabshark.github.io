name: 提问与答疑
description: 提交一个可复现的 OpenFOAM v2512 问题
title: '[提问] '
body:
  - type: markdown
    attributes:
      value: '所有内容公开可见。请勿填写密码、学号和未获准公开的数据。'
  - type: input
    id: lesson
    attributes:
      label: 关联课程
      placeholder: 例如：第 07 讲 网格质量
  - type: textarea
    id: question
    attributes:
      label: 问题描述
      description: 写出预期结果、实际现象与已经尝试的方法。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 复现步骤与日志
      description: 请补充 foamVersion、运行命令、关键日志与相关字典，可拖入附件。
    validations:
      required: true
