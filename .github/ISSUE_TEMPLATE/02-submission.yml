name: 作业提交
description: 提交课程作业与结果分析
title: '[作业提交] '
body:
  - type: markdown
    attributes:
      value: '作业公开提交，请只上传可以公开的算例与结果。'
  - type: input
    id: assignment
    attributes:
      label: 关联作业
      placeholder: 例如 #12
    validations:
      required: true
  - type: textarea
    id: analysis
    attributes:
      label: 完成情况与分析
      description: 说明修改的参数、依据、结果与验证。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 算例与结果附件
      description: 拖入压缩包、日志、结果图或 PDF。
