name: 作业发布（教师）
description: 教师发布正式作业，只有指定教师的记录进入网站作业列表
title: '[作业发布] '
body:
  - type: input
    id: due
    attributes:
      label: 截止日期
      description: 注明日期、时间和时区；不填表示未指定。
  - type: textarea
    id: task
    attributes:
      label: 任务要求
      description: 填写学习目标、操作任务、提交内容与验收标准。
    validations:
      required: true
