<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">16.1 · 从不可压缩算法走向可压缩算法</title><desc id="desc">喷管中的气体加速通常伴随静压、静温与密度变化，质量收支因此同时依赖速度和密度。</desc><rect width="960" height="540" fill="#f5f4eb"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" stroke-linecap="round" stroke-linejoin="round"><rect x="115" y="165" width="265" height="215" rx="0" fill="#deebe2" stroke="#294f49" stroke-width="2"/><rect x="580" y="165" width="265" height="215" rx="0" fill="#d3ab70" stroke="#294f49" stroke-width="2"/><path d="M405 273 L555 273" fill="none" stroke="#398678" stroke-width="4"/><path d="M542.7138441335347 279.71195754045885 L555 273 L542.7138441335347 266.28804245954115" stroke="#398678" stroke-width="4" fill="none"/><circle cx="150" cy="200" r="9" fill="#398678"/><circle cx="250" cy="220" r="9" fill="#398678"/><circle cx="300" cy="310" r="9" fill="#398678"/><circle cx="180" cy="345" r="9" fill="#398678"/><circle cx="330" cy="185" r="9" fill="#398678"/><circle cx="615" cy="205" r="9" fill="#294f49"/><circle cx="675" cy="205" r="9" fill="#294f49"/><circle cx="735" cy="205" r="9" fill="#294f49"/><circle cx="795" cy="205" r="9" fill="#294f49"/><circle cx="615" cy="265" r="9" fill="#294f49"/><circle cx="675" cy="265" r="9" fill="#294f49"/><circle cx="735" cy="265" r="9" fill="#294f49"/><circle cx="795" cy="265" r="9" fill="#294f49"/><circle cx="615" cy="325" r="9" fill="#294f49"/><circle cx="675" cy="325" r="9" fill="#294f49"/><circle cx="735" cy="325" r="9" fill="#294f49"/><circle cx="795" cy="325" r="9" fill="#294f49"/><text x="250" y="110" fill="#294f49" font-size="29" text-anchor="middle">低密度</text><text x="710" y="110" fill="#294f49" font-size="29" text-anchor="middle">高密度</text><text x="480" y="466" fill="#294f49" font-size="30" text-anchor="middle">状态关系连接  p、T、ρ</text></g></svg>
