<g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect x="64" y="60" width="512" height="276" rx="14" fill="#fffdf7" stroke="#4b8072" stroke-width="3"/><text x="96" y="111" font-size="27" fill="#4b8072" text-anchor="start">double flowRate(</text><text x="130" y="153" font-size="23" fill="#29463e" text-anchor="start">double area, double speed)</text><text x="95" y="198" font-size="28" fill="#29463e" text-anchor="start">{</text><text x="132" y="244" font-size="27" fill="#4b8072" text-anchor="start">return area * speed;</text><text x="95" y="290" font-size="28" fill="#29463e" text-anchor="start">}</text><text x="320" y="382" font-size="25" fill="#29463e" text-anchor="middle">类型 · 函数 · 类与模板</text></g></svg>