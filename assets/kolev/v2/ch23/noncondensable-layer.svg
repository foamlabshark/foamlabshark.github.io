<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">不凝气对凝结气膜的影响</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="420" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="80" y="250" width="600" height="95" fill="#b6d8d1"/><path d="M80 250L680 250" stroke="#278b9a" stroke-width="3" stroke-dasharray="" fill="none"/><text x="380" y="310" text-anchor="middle" font-size="25">过冷液膜</text><text x="380" y="50" text-anchor="middle" font-size="26">蒸汽 + 不凝气</text><path d="M240 90L240 225" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="171" y="161" text-anchor="middle" font-size="22">蒸汽扩散</text><path d="M540 185L540 280" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="590" y="155" text-anchor="middle" font-size="21">向液膜传热</text><circle cx="110" cy="230" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="160" cy="215" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="330" cy="232" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="370" cy="205" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="425" cy="232" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="610" cy="222" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="650" cy="245" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="340" cy="110" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><circle cx="610" cy="87" r="7" fill="#c18d54" stroke="#305b54" stroke-width="2"/><text x="385" y="383" text-anchor="middle" font-size="22">界面附近不凝气富集，蒸汽分压降低</text></g></svg>