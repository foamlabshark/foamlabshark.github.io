<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">过热气体供热与接收汽化质量</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="435" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="100" y="235" width="550" height="110" fill="#b6d8d1"/><rect x="100" y="65" width="550" height="170" fill="#e5ece7"/><path d="M100 235L650 235" stroke="#278b9a" stroke-width="3" stroke-dasharray="" fill="none"/><text x="380" y="105" text-anchor="middle" font-size="25">过热蒸汽 Tg &gt; Ts</text><text x="380" y="305" text-anchor="middle" font-size="25">饱和液膜 Ts</text><path d="M235 136L235 225" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="190" y="180" text-anchor="middle" font-size="22">供热</text><path d="M490 225L490 140" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="552" y="180" text-anchor="middle" font-size="22">蒸汽加入</text><text x="380" y="393" text-anchor="middle" font-size="24">气体显热减少，气相质量增加</text></g></svg>