<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" role="img" aria-labelledby="title"><title id="title">壁面和界面剪切共同影响液膜</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="415" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="70" y="258" width="620" height="28" fill="#ddbc91"/><rect x="70" y="145" width="620" height="113" fill="#b6d8d1"/><path d="M70 145L690 145" stroke="#278b9a" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M70 258L690 258" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M120 110L570 110" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="350" y="82" text-anchor="middle" font-size="24">气流与界面相对运动</text><path d="M160 160L400 160" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="539" y="176" text-anchor="middle" font-size="22">界面剪切 τi</text><path d="M430 244L220 244" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="542" y="252" text-anchor="middle" font-size="22">液壁剪切 τℓw</text><text x="380" y="328" text-anchor="middle" font-size="23">按作用周长与剪切幅值估计 τeff</text><text x="380" y="378" text-anchor="middle" font-size="25">u* = √(τeff / ρℓ)</text></g></svg>