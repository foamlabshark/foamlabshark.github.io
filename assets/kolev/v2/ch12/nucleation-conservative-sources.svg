<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">成核事件的成对质量转移</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="60" y="65" width="268" height="245" fill="#b6d8d1"/><rect x="432" y="65" width="268" height="245" fill="#e5ece7"/><circle cx="566" cy="175" r="52" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><path d="M326 175L429 175" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="196" y="115" text-anchor="middle" font-size="25">液体</text><text x="563" y="116" text-anchor="middle" font-size="25">新汽核</text><text x="196" y="261" text-anchor="middle" font-size="24">−ρᵥ Vc Jn</text><text x="566" y="261" text-anchor="middle" font-size="24">+ρᵥ Vc Jn</text><text x="380" y="39" text-anchor="middle" font-size="24">数量源 Jn 关联同一个核体积 Vc</text><text x="380" y="348" text-anchor="middle" font-size="24">相变焓从液体能量中一致扣除</text></g></svg>