<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">等质量液体团与汽泡的体积比较</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="375" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="55" y="70" width="650" height="230" fill="#b6d8d1"/><circle cx="175" cy="187" r="25" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><circle cx="551" cy="187" r="94" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><path d="M247 187L423 187" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="174" y="242" text-anchor="middle" font-size="24">R₁₀</text><text x="550" y="192" text-anchor="middle" font-size="25">R</text><text x="380" y="40" text-anchor="middle" font-size="24">同一份质量：ρℓ V₀ = ρᵥ V</text><text x="380" y="341" text-anchor="middle" font-size="24">汽化体积增量 ΔV = V − V₀</text></g></svg>