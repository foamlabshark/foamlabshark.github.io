<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">成核到覆盖的状态更新顺序</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="375" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><path d="M81 125L699 125" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M81 279L699 279" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M151 112L151 138" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><text x="151" y="66" text-anchor="middle" font-size="23">温压与初始核</text><text x="151" y="177" text-anchor="middle" font-size="21">状态和核来源</text><path d="M380 112L380 138" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><text x="380" y="66" text-anchor="middle" font-size="23">激活与出生</text><text x="380" y="177" text-anchor="middle" font-size="21">时间、位置、数量</text><path d="M609 112L609 138" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><text x="609" y="66" text-anchor="middle" font-size="23">各代增长</text><text x="609" y="177" text-anchor="middle" font-size="21">半径、面积、体积</text><path d="M646 181L646 230" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="382" y="258" text-anchor="middle" font-size="24">质量与能量约束全部更新</text><text x="382" y="337" text-anchor="middle" font-size="23">覆盖、并合或脱离后切换相应过程模型</text></g></svg>