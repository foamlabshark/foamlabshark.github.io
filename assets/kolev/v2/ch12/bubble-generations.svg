<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title"><title id="title">各代汽泡保留自己的出生时间</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="360" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><path d="M90 102L685 102" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="690" y="79" text-anchor="middle" font-size="23">t</text><path d="M175 89L175 119" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M175 128L175 155" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="175" cy="213" r="53" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><text x="175" y="309" text-anchor="middle" font-size="23">早出生</text><path d="M380 89L380 119" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M380 128L380 155" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="380" cy="213" r="40" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><text x="380" y="309" text-anchor="middle" font-size="23">中间出生</text><path d="M585 89L585 119" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M585 128L585 155" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="585" cy="213" r="23" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><text x="585" y="309" text-anchor="middle" font-size="23">晚出生</text><text x="380" y="42" text-anchor="middle" font-size="24">同一观察时刻：年龄不同，尺寸不同</text></g></svg>