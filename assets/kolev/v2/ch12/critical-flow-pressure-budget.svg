<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">驱动压差的两部分</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="370" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><path d="M120 285L120 57" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="90" y="57" text-anchor="middle" font-size="23">p</text><path d="M151 83L639 83" stroke="#305b54" stroke-width="2" stroke-dasharray="" fill="none"/><path d="M151 177L639 177" stroke="#278b9a" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M151 268L639 268" stroke="#c18d54" stroke-width="2" stroke-dasharray="" fill="none"/><text x="201" y="70" text-anchor="middle" font-size="25">p₀</text><text x="205" y="161" text-anchor="middle" font-size="25">psat</text><text x="205" y="253" text-anchor="middle" font-size="25">pFi</text><path d="M439 88L439 171" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M439 182L439 261" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="557" y="133" text-anchor="middle" font-size="22">入口压力余量</text><text x="557" y="228" text-anchor="middle" font-size="22">成核压力欠降</text><text x="380" y="335" text-anchor="middle" font-size="25">G* = Cd √[2ρℓ (p₀ − pFi)]</text></g></svg>