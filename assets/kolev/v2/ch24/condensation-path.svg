<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" role="img" aria-labelledby="title"><title id="title">凝结的热量与质量路径</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="425" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="80" y="60" width="180" height="290" fill="#ddbc91"/><rect x="260" y="60" width="95" height="290" fill="#b6d8d1"/><rect x="355" y="60" width="325" height="290" fill="#e5ece7"/><path d="M355 60L355 350" stroke="#278b9a" stroke-width="3" stroke-dasharray="" fill="none"/><text x="164" y="205" text-anchor="middle" font-size="28">冷壁</text><text x="306" y="205" text-anchor="middle" font-size="25">液膜</text><text x="525" y="115" text-anchor="middle" font-size="28">蒸汽</text><path d="M590 230L380 230" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="510" y="211" text-anchor="middle" font-size="22">凝结</text><path d="M330 290L135 290" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="224" y="329" text-anchor="middle" font-size="21">热量进入壁体</text><path d="M306 80L306 145" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M306 220L306 273" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="373" y="396" text-anchor="middle" font-size="23">凝液沿壁向下汇集，液膜构成传热阻力</text></g></svg>