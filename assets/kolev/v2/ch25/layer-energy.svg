<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="title"><title id="title">两层介质的功率收支</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="450" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="205" y="100" width="140" height="160" fill="#e5ece7"/><rect x="430" y="100" width="140" height="160" fill="#b6d8d1"/><text x="275" y="160" text-anchor="middle" font-size="24">蒸汽</text><text x="500" y="160" text-anchor="middle" font-size="24">水</text><path d="M50 205L205 205" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M345 205L430 205" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M570 205L710 205" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="108" y="182" text-anchor="middle" font-size="23">Qin</text><text x="387" y="182" text-anchor="middle" font-size="23">Q₁</text><text x="651" y="182" text-anchor="middle" font-size="23">Qout</text><path d="M275 260L275 327" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><path d="M500 260L500 327" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="275" y="361" text-anchor="middle" font-size="23">净吸收 QAv</text><text x="500" y="361" text-anchor="middle" font-size="23">净吸收 QAw</text><text x="380" y="420" text-anchor="middle" font-size="26">Qin = QAv + QAw + Qout</text></g></svg>