<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title"><title id="title">外部光线在三层球体中的路径分区</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="430" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="380" cy="205" r="150" fill="#b6d8d1" stroke="#305b54" stroke-width="2"/><circle cx="380" cy="205" r="95" fill="#e5ece7" stroke="#305b54" stroke-width="2"/><circle cx="380" cy="205" r="40" fill="#ddbc91" stroke="#305b54" stroke-width="2"/><path d="M247.084380241115 80L492.915619758885 80" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M192.5227291513248 145L547.4772708486752 145" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M180.0 205L340 205" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="570" y="89" text-anchor="middle" font-size="19">一：只穿水</text><text x="610" y="153" text-anchor="middle" font-size="19">二：绕过颗粒</text><text x="600" y="220" text-anchor="middle" font-size="19">三：到达颗粒</text><text x="380" y="400" text-anchor="middle" font-size="23">三类光线按投影面积分配权重</text></g></svg>