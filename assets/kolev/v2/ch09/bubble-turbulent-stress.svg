<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">粒径尺度上的速度差引起变形</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="365" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="380" cy="180" r="80" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><text x="380" y="45" text-anchor="middle" font-size="24">粒径尺度两侧的速度不同</text><path d="M150 130L260 130" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M615 230L505 230" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M326 135L349 156" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><path d="M434 225L411 204" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><text x="146" y="92" text-anchor="middle" font-size="27">u₁</text><text x="615" y="280" text-anchor="middle" font-size="27">u₂</text><path d="M300 297H460" fill="none" stroke="#305b54" stroke-width="2"/><path d="M300 285V309M460 285V309" fill="none" stroke="#305b54" stroke-width="2"/><text x="380" y="335" text-anchor="middle" font-size="25">D；δu = u₂ − u₁</text></g></svg>