<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">两种颗粒对流体加速的不同响应</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="370" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><text x="380" y="45" text-anchor="middle" font-size="24">流体加速 → 压力梯度与附加质量作用</text><circle cx="195" cy="179" r="55" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="562" cy="179" r="55" fill="#d9c19e" stroke="#c18d54" stroke-width="2"/><text x="195" y="288" text-anchor="middle" font-size="25">轻气泡</text><text x="562" y="288" text-anchor="middle" font-size="25">重液滴</text><path d="M85 104L285 104" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M451 104L651 104" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M164 179L288 179" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M531 179L575 179" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><text x="380" y="340" text-anchor="middle" font-size="21">初始无滑移时，响应仍由密度与附加质量决定</text></g></svg>