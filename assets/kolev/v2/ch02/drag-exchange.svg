<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title"><title id="title">颗粒和连续相的等大反向动量交换</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2a8796"/></marker></defs><rect width="760" height="340" rx="10" fill="#f5f7f1"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#305b54" stroke-linejoin="round">
<rect x="40" y="65" width="310" height="200" fill="#dfefeb" rx="5"/><rect x="410" y="65" width="310" height="200" fill="#dfefeb" rx="5"/>
<text x="195" y="36" text-anchor="middle">颗粒所受阻力</text><text x="565" y="36" text-anchor="middle">流体所受反作用力</text>
<circle cx="235" cy="165" r="35" fill="#d1ac7e" stroke="#796749" stroke-width="1.7"/>
