<text x="150" y="205" text-anchor="middle">−K ur</text><text x="605" y="205" text-anchor="middle">+K ur</text>
<path d="M210 103H310" stroke="#2a8796" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380" y="315" text-anchor="middle">ur = Vd − Vc：颗粒相对流体向右运动</text></g></svg>