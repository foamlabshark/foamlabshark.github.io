<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" role="img" aria-labelledby="title"><title id="title">等体积气泡的高度和宽度</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2a8796"/></marker></defs><rect width="760" height="355" rx="10" fill="#f5f7f1"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" font-size="24" fill="#305b54" stroke-linejoin="round">
<path d="M380 45V290" stroke="#c5d7ce"/>
<circle cx="190" cy="166" r="65" fill="#dfefeb" stroke="#305b54" stroke-width="2"/>
<ellipse cx="570" cy="166" rx="90.1388" ry="33.799" fill="#dfefeb" stroke="#305b54" stroke-width="2"/>
<path d="M125 250H255M480 235H660M279 101V231M685 132V200" stroke="#2a8796" stroke-width="1.5"/>
