<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">接近与分离的速度符号</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><text x="182" y="57" text-anchor="middle" font-size="23">接近：中心距减小</text><circle cx="105" cy="178" r="28" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="260" cy="178" r="28" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M106 135L175 135" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M259 135L190 135" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M105 235H260" stroke="#305b54" stroke-width="2" stroke-dasharray="5 4"/><text x="182" y="294" text-anchor="middle" font-size="22">沿连心线比较速度</text><text x="567" y="57" text-anchor="middle" font-size="23">分离：中心距增大</text><circle cx="490" cy="178" r="28" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="645" cy="178" r="28" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M560 135L491 135" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><path d="M575 135L644 135" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><path d="M490 235H645" stroke="#305b54" stroke-width="2" stroke-dasharray="5 4"/><text x="567" y="294" text-anchor="middle" font-size="22">沿连心线比较速度</text></g></svg>