<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">粒径方程中各机制的作用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><text x="380" y="60" text-anchor="middle" font-size="31">代表粒径 D</text><text x="178" y="165" text-anchor="middle" font-size="27">细滴卷吸 · 破碎</text><text x="582" y="165" text-anchor="middle" font-size="27">粗滴卷吸 · 聚并</text><path d="M351 96L205 130" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M410 96L555 130" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><text x="178" y="220" text-anchor="middle" font-size="27">减小</text><text x="582" y="220" text-anchor="middle" font-size="27">增大</text><text x="380" y="300" text-anchor="middle" font-size="24">等比例沉积：数量与体积同比减少</text></g></svg>