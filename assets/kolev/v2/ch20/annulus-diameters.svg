<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">环形通道的几何基准</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="370" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="240" cy="190" r="132" fill="#b6d8d1" stroke="#305b54" stroke-width="2"/><circle cx="240" cy="190" r="64" fill="#ddbc91" stroke="#305b54" stroke-width="2"/><path d="M108 190L372 190" stroke="#305b54" stroke-width="2" stroke-dasharray="" fill="none"/><text x="240" y="166" text-anchor="middle" font-size="24">Do</text><path d="M176 254L176 310" stroke="#c18d54" stroke-width="1" stroke-dasharray="" fill="none"/><path d="M304 254L304 310" stroke="#c18d54" stroke-width="1" stroke-dasharray="" fill="none"/><path d="M176 300L304 300" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><text x="240" y="330" text-anchor="middle" font-size="24">Di</text><text x="545" y="105" text-anchor="middle" font-size="24">湿周：π(Do + Di)</text><text x="545" y="165" text-anchor="middle" font-size="24">受热周长：πDi</text><text x="545" y="233" text-anchor="middle" font-size="24">Dh = Do − Di</text><text x="550" y="292" text-anchor="middle" font-size="21">Dheat = (Do² − Di²)/Di</text></g></svg>