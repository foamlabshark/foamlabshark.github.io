<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">壁面弛豫时间与沉积机制</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><path d="M74 243L688 243" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><text x="130" y="292" text-anchor="middle" font-size="27">τp+ ≪ 1</text><text x="380" y="292" text-anchor="middle" font-size="24">惯性沉积增强</text><text x="625" y="292" text-anchor="middle" font-size="27">τp+ &gt; 30</text><text x="125" y="74" text-anchor="middle" font-size="24">布朗迁移</text><text x="380" y="74" text-anchor="middle" font-size="24">湍流与惯性</text><text x="626" y="74" text-anchor="middle" font-size="24">经验平台</text><text x="625" y="174" text-anchor="middle" font-size="23">K32 / u* ≈ 0.15</text><path d="M217 108V215M526 108V215" stroke="#305b54" stroke-dasharray="5 6"/><text x="380" y="338" text-anchor="middle" font-size="20">分区示意；平台不代表无限粒径极限</text></g></svg>