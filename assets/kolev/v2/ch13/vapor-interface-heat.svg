<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">液侧供热在潜热与蒸汽显热之间分配</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="370" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="60" y="70" width="245" height="220" fill="#b6d8d1"/><rect x="305" y="70" width="390" height="220" fill="#e5ece7"/><path d="M305 70L305 290" stroke="#278b9a" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M99 180L268 180" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><path d="M343 180L488 180" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><path d="M305 255L417 255" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="170" y="115" text-anchor="middle" font-size="24">液体供热</text><text x="525" y="115" text-anchor="middle" font-size="24">蒸汽显热</text><text x="525" y="219" text-anchor="middle" font-size="22">qg = ai h (Ti − Tv)</text><text x="380" y="340" text-anchor="middle" font-size="22">供给潜热的部分 = 液侧热量 − 气侧热量</text></g></svg>