<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">混合气泡的质量与热量记账</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="70" y="70" width="260" height="235" fill="#b6d8d1"/><circle cx="495" cy="182" r="100" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><text x="195" y="115" text-anchor="middle" font-size="25">液体</text><text x="495" y="137" text-anchor="middle" font-size="22">蒸汽 + 不凝气体</text><text x="495" y="190" text-anchor="middle" font-size="23">mv 增加</text><text x="495" y="237" text-anchor="middle" font-size="23">mn 不变</text><path d="M245 190L381 190" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="300" y="163" text-anchor="middle" font-size="20">相变质量</text><text x="195" y="270" text-anchor="middle" font-size="22">能量减少</text><text x="380" y="348" text-anchor="middle" font-size="23">更新 pv、Yv、Mg，再计算下一时刻传质</text></g></svg>