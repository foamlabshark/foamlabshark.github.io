<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">由单泡质量增长得到体积源项</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="80" y="65" width="600" height="245" fill="#b6d8d1"/><circle cx="170" cy="130" r="27" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="170" cy="130" r="37" fill="none" stroke="#c18d54" stroke-width="2"/><circle cx="330" cy="135" r="27" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="330" cy="135" r="37" fill="none" stroke="#c18d54" stroke-width="2"/><circle cx="535" cy="123" r="27" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="535" cy="123" r="37" fill="none" stroke="#c18d54" stroke-width="2"/><circle cx="253" cy="246" r="27" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="253" cy="246" r="37" fill="none" stroke="#c18d54" stroke-width="2"/><circle cx="480" cy="239" r="27" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="480" cy="239" r="37" fill="none" stroke="#c18d54" stroke-width="2"/><text x="380" y="38" text-anchor="middle" font-size="23">同一控制体积内，汽泡总数保持不变</text><text x="380" y="348" text-anchor="middle" font-size="26">μ = n d(ρᵥ Vb) / dt</text></g></svg>