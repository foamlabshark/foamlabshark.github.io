<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">汽泡周围的热层与径向运动</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="40" y="45" width="680" height="270" fill="#b6d8d1"/><circle cx="270" cy="180" r="116" fill="none" stroke="#c18d54" stroke-width="2"/><circle cx="270" cy="180" r="77" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><text x="269" y="186" text-anchor="middle" font-size="25">蒸汽</text><path d="M119 180L185 180" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><path d="M421 180L355 180" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><path d="M270 35L270 98" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><text x="550" y="91" text-anchor="middle" font-size="23">主体液体 Tℓ</text><text x="552" y="145" text-anchor="middle" font-size="23">界面温度 Ti</text><path d="M458 151L343 153" stroke="#305b54" stroke-width="2" stroke-dasharray="" fill="none"/><text x="549" y="246" text-anchor="middle" font-size="23">热层持续发展</text><path d="M454 239L363 251" stroke="#305b54" stroke-width="2" stroke-dasharray="" fill="none"/><text x="380" y="347" text-anchor="middle" font-size="22">热流供给汽化潜热，周围液体被向外排开</text></g></svg>