<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">相变质量与液体热流的符号</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="375" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="70" y="75" width="310" height="230" fill="#e5ece7"/><rect x="380" y="75" width="310" height="230" fill="#b6d8d1"/><path d="M380 75L380 305" stroke="#278b9a" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M626 170L450 170" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><path d="M448 247L291 247" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="213" y="120" text-anchor="middle" font-size="24">蒸汽</text><text x="541" y="120" text-anchor="middle" font-size="24">过热液体</text><text x="547" y="204" text-anchor="middle" font-size="22">液体向界面供热</text><text x="295" y="284" text-anchor="middle" font-size="24">j &gt; 0</text><text x="380" y="44" text-anchor="middle" font-size="22">qℓ″ 以指向液体为正，本图 qℓ″ &lt; 0</text><text x="380" y="345" text-anchor="middle" font-size="24">界面能量平衡：j hfg = −qℓ″</text></g></svg>