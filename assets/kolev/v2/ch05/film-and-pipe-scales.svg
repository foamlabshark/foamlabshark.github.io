<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">圆管液膜的两个长度尺度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="250" cy="172" r="130" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="250" cy="172" r="101" fill="#f5f7f1" stroke="#278b9a" stroke-width="2"/><path d="M120 172H380" stroke="#305b54" stroke-dasharray="6 5"/><text x="250" y="166" text-anchor="middle" font-size="27">Dh</text><path d="M352 172L378 172" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><text x="423" y="174" text-anchor="middle" font-size="27">δ2</text><text x="594" y="102" text-anchor="middle" font-size="24">管径尺度</text><text x="594" y="148" text-anchor="middle" font-size="21">Re2 = G2 Dh / η2</text><text x="594" y="235" text-anchor="middle" font-size="24">膜厚尺度</text><text x="594" y="280" text-anchor="middle" font-size="21">Re2F = 4ρ2 w2 δ2 / η2</text></g></svg>