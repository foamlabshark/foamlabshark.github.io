<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">气液滴液膜分为等效气芯与液膜</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="80" y="62" width="230" height="222" fill="#b6d8d1" stroke="#305b54" stroke-width="3"/><rect x="112" y="62" width="166" height="222" fill="#f5f7f1"/><rect x="450" y="62" width="230" height="222" fill="#b6d8d1" stroke="#305b54" stroke-width="3"/><rect x="482" y="62" width="166" height="222" fill="#e9dcc6"/><text x="195" y="36" text-anchor="middle" font-size="25">三个速度场</text><text x="565" y="36" text-anchor="middle" font-size="25">气芯—液膜</text><path d="M335 169L421 169" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M197 264L197 95" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M565 264L565 95" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><text x="195" y="326" text-anchor="middle" font-size="23">气体、液滴、液膜</text><text x="565" y="326" text-anchor="middle" font-size="23">气体 + 液滴 = 气芯</text><circle cx="145" cy="119" r="10" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="252" cy="172" r="10" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="147" cy="226" r="10" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/></g></svg>