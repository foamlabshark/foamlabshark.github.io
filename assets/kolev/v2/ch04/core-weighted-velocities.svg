<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">气芯质量平均与体积平均速度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><text x="380" y="42" text-anchor="middle" font-size="25">气芯内：α1 = 0.80，α3 = 0.05</text><path d="M75 240H690" stroke="#305b54" stroke-width="2"/><path d="M120 224V255" stroke="#c18d54" stroke-width="3"/><path d="M120 111V220" stroke="#c18d54" stroke-width="1.5"/><text x="120" y="101" text-anchor="middle" font-size="21">液滴速度 w3</text><path d="M175 224V255" stroke="#c18d54" stroke-width="3"/><path d="M175 173V220" stroke="#c18d54" stroke-width="1.5"/><text x="175" y="163" text-anchor="middle" font-size="21">质量平均速度</text><path d="M595 224V255" stroke="#278b9a" stroke-width="3"/><path d="M595 111V220" stroke="#278b9a" stroke-width="1.5"/><text x="595" y="101" text-anchor="middle" font-size="21">体积平均速度</text><path d="M635 224V255" stroke="#305b54" stroke-width="3"/><path d="M635 173V220" stroke="#305b54" stroke-width="1.5"/><text x="635" y="163" text-anchor="middle" font-size="21">气体速度 w1</text><text x="380" y="305" text-anchor="middle" font-size="23">ρ3 ≫ ρ1 时，液滴对质量平均的权重明显增大</text></g></svg>