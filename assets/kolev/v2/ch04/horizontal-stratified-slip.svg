<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">水平分层截面与两相速度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><defs><clipPath id="pipe"><circle cx="194" cy="171" r="115"/></clipPath></defs><circle cx="194" cy="171" r="115" fill="#f5f7f1" stroke="#305b54" stroke-width="3"/><rect x="75" y="174" width="238" height="118" fill="#b6d8d1" clip-path="url(#pipe)"/><path d="M80 174H308" stroke="#278b9a" stroke-width="2"/><text x="194" y="120" text-anchor="middle" font-size="26">气相 α1</text><text x="194" y="233" text-anchor="middle" font-size="25">液相 1 − α1</text><path d="M398 116L687 116" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><path d="M398 240L592 240" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="88" text-anchor="middle" font-size="25">w1</text><text x="492" y="211" text-anchor="middle" font-size="25">w2</text><text x="390" y="331" text-anchor="middle" font-size="26">S = w1 / w2</text></g></svg>