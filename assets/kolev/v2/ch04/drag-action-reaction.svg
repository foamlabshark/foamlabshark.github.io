<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">连续相与分散相的作用反作用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><text x="215" y="45" text-anchor="middle" font-size="22">连续相</text><text x="548" y="45" text-anchor="middle" font-size="22">分散相</text><rect x="70" y="90" width="285" height="150" fill="#b6d8d1" stroke="#305b54"/><circle cx="550" cy="166" r="47" fill="#c18d54" stroke="#278b9a" stroke-width="2"/><path d="M105 124L302 124" fill="none" stroke="#278b9a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="220" y="110" text-anchor="middle" font-size="20">wc</text><path d="M505 79L587 79" fill="none" stroke="#278b9a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="548" y="66" text-anchor="middle" font-size="20">wd</text><path d="M290 200L140 200" fill="none" stroke="#c18d54" stroke-width="2.5" marker-end="url(#force)"/><path d="M506 166L656 166" fill="none" stroke="#c18d54" stroke-width="2.5" marker-end="url(#force)"/><text x="214" y="275" text-anchor="middle" font-size="22">力：−K(wc − wd)</text><text x="549" y="275" text-anchor="middle" font-size="22">力：+K(wc − wd)</text><text x="380" y="326" text-anchor="middle" font-size="22">示例：wc > wd，K > 0</text></g></svg>