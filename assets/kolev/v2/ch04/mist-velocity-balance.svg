<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">雾状流的速度守恒</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="118" y="66" width="235" height="236" fill="#f5f7f1" stroke="#305b54" stroke-width="3"/><path d="M235 270L235 108" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><text x="235" y="42" text-anchor="middle" font-size="25">气体与液滴</text><circle cx="163" cy="147" r="13" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M163 128L163 92" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="297" cy="187" r="13" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M297 168L297 132" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="177" cy="251" r="13" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M177 232L177 196" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="294" cy="98" r="13" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M294 79L294 43" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><text x="555" y="104" text-anchor="middle" font-size="25">w1 = 10.1 m/s</text><text x="555" y="174" text-anchor="middle" font-size="25">j = 10.0 m/s</text><text x="555" y="244" text-anchor="middle" font-size="25">w3 = 8.1 m/s</text><text x="380" y="337" text-anchor="middle" font-size="23">α3 = 0.05，w1 − j = α3(w1 − w3)</text></g></svg>