<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">凝结源项符号保持一致</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="375" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="50" y="70" width="660" height="230" fill="#b6d8d1"/><circle cx="255" cy="181" r="82" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><path d="M338 180L506 180" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M320 245L505 245" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><text x="255" y="175" text-anchor="middle" font-size="20">蒸汽失去质量</text><text x="550" y="143" text-anchor="middle" font-size="23">液体获得质量</text><text x="550" y="281" text-anchor="middle" font-size="23">液体吸热</text><text x="380" y="39" text-anchor="middle" font-size="25">Ṙ &lt; 0，μvℓ &gt; 0</text><text x="380" y="346" text-anchor="middle" font-size="23">气相质量源 −μvℓ；液相质量源 +μvℓ</text></g></svg>