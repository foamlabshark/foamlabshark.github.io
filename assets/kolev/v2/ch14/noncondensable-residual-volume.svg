<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">含气泡留下平衡残余体积</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="50" y="60" width="660" height="255" fill="#b6d8d1"/><circle cx="210" cy="180" r="96" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="569" cy="180" r="48" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><path d="M333 180L463 180" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="211" y="171" text-anchor="middle" font-size="22">蒸汽 + 气体</text><text x="568" y="180" text-anchor="middle" font-size="20">残余泡</text><text x="210" y="291" text-anchor="middle" font-size="23">初始体积 V₀</text><text x="570" y="291" text-anchor="middle" font-size="23">V∞ = V₀ / 8</text><text x="380" y="37" text-anchor="middle" font-size="24">不凝气体质量 mn 保持不变</text><text x="380" y="350" text-anchor="middle" font-size="25">示例：R∞ / R₀ = 1/2</text></g></svg>