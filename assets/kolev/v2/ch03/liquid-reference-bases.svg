<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">实际液相和全液相参考流量</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="310" y="74" width="365" height="65" fill="#b6d8d1" stroke="#305b54" stroke-width="2"/><rect x="310" y="205" width="365" height="65" fill="#b6d8d1" stroke="#305b54" stroke-width="2"/><path d="M344 106L505 106" stroke="#278b9a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M344 236L645 236" stroke="#278b9a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="166" y="99" font-size="22" text-anchor="middle" fill="#305b54">液相自身流率</text><text x="166" y="130" font-size="19" text-anchor="middle" fill="#305b54">G₂ = (1 − x)G</text><text x="166" y="230" font-size="22" text-anchor="middle" fill="#305b54">总流率全按液体</text><text x="166" y="261" font-size="19" text-anchor="middle" fill="#305b54">G</text><text x="495" y="60" font-size="22" text-anchor="middle" fill="#305b54">gR2</text><text x="495" y="192" font-size="22" text-anchor="middle" fill="#305b54">gR20</text><text x="384" y="322" font-size="22" text-anchor="middle" fill="#305b54">两者使用同一管道和液体物性</text></g></svg>