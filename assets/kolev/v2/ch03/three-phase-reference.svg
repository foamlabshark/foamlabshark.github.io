<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">三相弹状流压降的组成</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><text x="380" y="65" font-size="27" text-anchor="middle" fill="#305b54">gR = g32 + C√(g32 g10) + g10</text><rect x="75" y="130" width="180" height="95" fill="#b6d8d1" stroke="#305b54" stroke-width="2"/><rect x="290" y="130" width="180" height="95" fill="#f5f7f1" stroke="#305b54" stroke-width="2"/><rect x="505" y="130" width="180" height="95" fill="#f5f7f1" stroke="#305b54" stroke-width="2"/><text x="165" y="169" font-size="22" text-anchor="middle" fill="#305b54">液固参考</text><text x="165" y="201" font-size="24" text-anchor="middle" fill="#305b54">g32</text><text x="380" y="169" font-size="22" text-anchor="middle" fill="#305b54">相互作用</text><text x="380" y="201" font-size="22" text-anchor="middle" fill="#305b54">交叉项</text><text x="595" y="169" font-size="22" text-anchor="middle" fill="#305b54">气相参考</text><text x="595" y="201" font-size="24" text-anchor="middle" fill="#305b54">g10</text><text x="380" y="293" font-size="22" text-anchor="middle" fill="#305b54">同一总压降由参考梯度组合得到</text></g></svg>