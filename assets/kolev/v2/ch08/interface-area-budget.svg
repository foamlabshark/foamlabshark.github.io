<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">剥离过程的净面积预算</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="155" cy="157" r="65" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M245 157L340 157" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="430" cy="157" r="44" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><text x="155" y="55" text-anchor="middle" font-size="24">母滴原面积</text><text x="432" y="55" text-anchor="middle" font-size="24">母滴面积减小</text><text x="642" y="55" text-anchor="middle" font-size="24">小滴面积增加</text><text x="380" y="320" text-anchor="middle" font-size="23">净面积源 = 新生面积率 + 母滴面积变化率</text><circle cx="635" cy="107" r="15" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="675" cy="137" r="15" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="620" cy="157" r="15" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="655" cy="197" r="15" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="615" cy="222" r="15" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/></g></svg>