<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">二分裂的颗粒净数量</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="350" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="157" cy="165" r="72" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><path d="M260 165L389 165" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="505" cy="165" r="57.15" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="645" cy="165" r="57.15" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><text x="160" y="55" text-anchor="middle" font-size="24">母滴：1</text><text x="570" y="55" text-anchor="middle" font-size="24">子滴：2</text><text x="380" y="307" text-anchor="middle" font-size="26">出生 2 − 消失 1 = 净增 1</text></g></svg>