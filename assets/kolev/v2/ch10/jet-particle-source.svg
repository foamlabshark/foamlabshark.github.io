<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">连续液核分散的质量和数量守恒</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><path d="M92 110H225L250 240H92Z" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><text x="169" y="64" text-anchor="middle" font-size="24">连续液核</text><path d="M290 175L424 175" fill="none" stroke="#278b9a" stroke-width="3" marker-end="url(#arrow)"/><text x="356" y="132" text-anchor="middle" font-size="27">ṁⱼ→d</text><circle cx="488" cy="135" r="22" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="560" cy="164" r="20" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="630" cy="125" r="25" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="507" cy="233" r="18" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="622" cy="233" r="22" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><text x="566" y="64" text-anchor="middle" font-size="24">液滴场</text><text x="380" y="307" text-anchor="middle" font-size="24">液核质量源 −ṁ；液滴质量源 +ṁ</text><text x="380" y="345" text-anchor="middle" font-size="24">颗粒出生率 = ṁ / 单滴质量</text></g></svg>