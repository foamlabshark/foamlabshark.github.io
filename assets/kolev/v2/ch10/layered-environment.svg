<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" role="img" aria-labelledby="title"><title id="title">两相环境的接触长度加权</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="385" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="100" y="70" width="565" height="60" fill="#dfe9e5"/><rect x="100" y="130" width="565" height="80" fill="#b6d8d1"/><rect x="100" y="210" width="565" height="40" fill="#dfe9e5"/><rect x="100" y="250" width="565" height="70" fill="#b6d8d1"/><path d="M333 60L358 321H403L428 60Z" fill="#ddc4a3" stroke="#c18d54" stroke-width="2"/><path d="M380 82L380 153" fill="none" stroke="#c18d54" stroke-width="3" marker-end="url(#force)"/><text x="575" y="110" text-anchor="middle" font-size="22">气相接触段</text><text x="575" y="180" text-anchor="middle" font-size="22">液相接触段</text><text x="380" y="357" text-anchor="middle" font-size="24">q₁ + q₂ = 1；按卷吸速度加权</text></g></svg>