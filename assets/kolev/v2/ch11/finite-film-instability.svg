<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">法向加速与切向剪切的不同载荷</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="375" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="225" cy="194" r="113" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="225" cy="194" r="83" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><text x="225" y="45" text-anchor="middle" font-size="23">法向加速</text><path d="M225 62L225 121" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M85 194L141 194" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M365 194L309 194" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="225" y="340" text-anchor="middle" font-size="22">有限曲面限制可容纳波长</text><circle cx="565" cy="194" r="113" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="565" cy="194" r="83" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><text x="565" y="45" text-anchor="middle" font-size="23">切向剪切</text><path d="M468 78L650 78" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 96L493 96" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><text x="565" y="340" text-anchor="middle" font-size="22">两侧相对速度进入平方项</text></g></svg>