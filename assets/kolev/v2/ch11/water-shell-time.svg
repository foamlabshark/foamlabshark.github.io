<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">水层体积和中层换热面积</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="340" cy="191" r="121" fill="#b6d8d1" stroke="#278b9a" stroke-width="2"/><circle cx="340" cy="191" r="77" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><circle cx="340" cy="191" r="99" fill="none" stroke="#305b54" stroke-dasharray="6 6" stroke-width="2"/><path d="M340 191L417 191" stroke="#c18d54" stroke-width="3" stroke-dasharray="" fill="none"/><path d="M417 191L461 191" stroke="#278b9a" stroke-width="4" stroke-dasharray="" fill="none"/><text x="379" y="174" text-anchor="middle" font-size="21">Df / 2</text><text x="503" y="201" text-anchor="middle" font-size="23">δ₂F</text><path d="M340 191L270 121" stroke="#305b54" stroke-width="2" stroke-dasharray="" fill="none"/><text x="188" y="105" text-anchor="middle" font-size="22">中层半径</text><text x="186" y="137" text-anchor="middle" font-size="21">Df / 2 + δ₂F / 2</text><text x="380" y="345" text-anchor="middle" font-size="23">外径：Df + 2δ₂F；中层面积：π(Df + δ₂F)²</text></g></svg>