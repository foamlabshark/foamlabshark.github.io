<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 375" role="img" aria-labelledby="title"><title id="title">碎片最终形态取决于热历史</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="375" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="159" cy="193" r="84" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><path d="M92 144A84 84 0 0 1 226 144" fill="none" stroke="#305b54" stroke-width="10"/><path d="M150 117L163 135L155 150" fill="none" stroke="#f5f7f1" stroke-width="5"/><path d="M266 193L350 193" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="450" cy="193" r="51" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><circle cx="561" cy="164" r="22" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><circle cx="591" cy="235" r="14" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><path d="M645 193L706 193" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="160" y="55" text-anchor="middle" font-size="22">冷斑结壳与开裂</text><text x="519" y="55" text-anchor="middle" font-size="22">离开接触区后</text><text x="381" y="337" text-anchor="middle" font-size="24">周围过热熔体可使薄壳再次熔化</text></g></svg>