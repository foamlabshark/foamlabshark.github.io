<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">移动气膜外边界的壳层状态</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="force" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="380" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><rect x="65" y="62" width="630" height="245" fill="#b6d8d1"/><circle cx="370" cy="190" r="105" fill="#e5ece7" stroke="#278b9a" stroke-width="2"/><circle cx="370" cy="190" r="66" fill="#ddbc91" stroke="#c18d54" stroke-width="2"/><path d="M370 190L472 190" stroke="#305b54" stroke-width="2" stroke-dasharray="" fill="none"/><text x="435" y="176" text-anchor="middle" font-size="22">R(t)</text><path d="M370 190L370 125" stroke="#c18d54" stroke-width="2" stroke-dasharray="" fill="none"/><text x="343" y="146" text-anchor="middle" font-size="22">R₃</text><path d="M588 187L500 187" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="582" y="160" text-anchor="middle" font-size="25">p₂</text><text x="371" y="265" text-anchor="middle" font-size="23">p₁、T₁、Cn</text><path d="M297 151L259 126" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#force)"/><text x="193" y="119" text-anchor="middle" font-size="22">传热与相变</text><text x="380" y="344" text-anchor="middle" font-size="24">壳层体积 V = 4π (R³ − R₃³) / 3</text></g></svg>