<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">蒸发界面能量收支</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#278b9a"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c18d54"/></marker></defs><rect width="760" height="435" rx="10" fill="#f5f7f1"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#305b54"><circle cx="220" cy="205" r="100" fill="#b6d8d1" stroke="#305b54" stroke-width="2"/><text x="220" y="200" text-anchor="middle" font-size="25">液滴 Td</text><text x="220" y="237" text-anchor="middle" font-size="22">内部导热</text><path d="M320 65L320 340" stroke="#305b54" stroke-width="2" stroke-dasharray="6 5" fill="none"/><text x="320" y="45" text-anchor="middle" font-size="24">界面 Ti</text><path d="M650 125L342 125" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="512" y="103" text-anchor="middle" font-size="21">气体输入显热 −Qg</text><path d="M320 205L575 205" stroke="#278b9a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="510" y="239" text-anchor="middle" font-size="22">蒸发消耗 μe L</text><path d="M320 285L225 285" stroke="#c18d54" stroke-width="3" fill="none" marker-end="url(#heat)"/><text x="464" y="330" text-anchor="middle" font-size="22">液滴吸热 Qd（可反向）</text><text x="380" y="395" text-anchor="middle" font-size="25">Qd + Qg + μe L = 0</text></g></svg>