<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 430" role="img" aria-labelledby="title"><title id="title">Suter角度的圆周定义</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="750" height="430" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><circle cx="350" cy="205" r="137" fill="#f5f7f1" stroke="#305b54" stroke-width="1.4"/><path d="M140.00 205.00L585.00 205.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M350.00 365.00L350.00 40.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M350.00 205.00L447.00 108.00" fill="none" stroke="#298999" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M420 205A70 70 0 0 0 400 155" fill="none" stroke="#bc8c4d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="437.00" y="183.00" fill="#bc8c4d" font-size="23" text-anchor="middle">X</text><text x="466.00" y="101.00" fill="#298999" font-size="20" text-anchor="middle">a = q = 1</text><text x="585.00" y="235.00" fill="#305b54" font-size="25" text-anchor="middle">q</text><text x="375.00" y="35.00" fill="#305b54" font-size="25" text-anchor="middle">a</text><text x="570.00" y="184.00" fill="#305b54" font-size="20" text-anchor="middle">X = 0</text><text x="283.00" y="45.00" fill="#305b54" font-size="21" text-anchor="middle">π/2</text><text x="142.00" y="185.00" fill="#305b54" font-size="22" text-anchor="middle">π</text><text x="290.00" y="365.00" fill="#305b54" font-size="21" text-anchor="middle">3π/2</text><text x="350.00" y="405.00" fill="#305b54" font-size="22" text-anchor="middle">X = atan2(a, q)；R² = a² + q²</text></g></svg>