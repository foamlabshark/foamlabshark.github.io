<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">触及最大升程与保持全开的条件</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="720" height="360" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M80.00 225.00L650.00 225.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="650.00" y="255.00" fill="#305b54" font-size="21" text-anchor="middle">ze / zmax</text><path d="M100.00 218.00L100.00 232.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round"/><text x="100.00" y="255.00" fill="#305b54" font-size="20" text-anchor="middle">0</text><path d="M330.00 218.00L330.00 232.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round"/><text x="330.00" y="255.00" fill="#305b54" font-size="20" text-anchor="middle">1/2</text><path d="M560.00 218.00L560.00 232.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round"/><text x="560.00" y="255.00" fill="#305b54" font-size="20" text-anchor="middle">1</text><rect x="100" y="115" width="230" height="60" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="330" y="115" width="230" height="60" fill="#eadcc4" stroke="#305b54" stroke-width="1.3"/><rect x="560" y="115" width="80" height="60" fill="#cbded0" stroke="#305b54" stroke-width="1.3"/><text x="215.00" y="150.00" fill="#305b54" font-size="21" text-anchor="middle">未触及上限</text><text x="445.00" y="150.00" fill="#305b54" font-size="21" text-anchor="middle">触及后离开</text><text x="600.00" y="143.00" fill="#305b54" font-size="17" text-anchor="middle">可保持</text><text x="600.00" y="165.00" fill="#305b54" font-size="17" text-anchor="middle">全开</text><text x="360.00" y="65.00" fill="#305b54" font-size="21" text-anchor="middle">无阻尼，从关闭静止状态施加恒定载荷</text><text x="360.00" y="320.00" fill="#305b54" font-size="20" text-anchor="middle">首个峰值 2ze；接触上限后的净力 k(ze − zmax)</text></g></svg>