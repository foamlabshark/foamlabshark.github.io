<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">管网压力与安全阀运动的相互作用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="720" height="360" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="55" y="100" width="165" height="150" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="137.00" y="160.00" fill="#305b54" font-size="22" text-anchor="middle">上游容积</text><text x="137.00" y="201.00" fill="#305b54" font-size="24" text-anchor="middle">pin(t)</text><path d="M220 155H320M220 205H320" fill="none" stroke="#305b54" stroke-width="3" stroke-linejoin="round"/><path d="M365 155H650M365 205H650" fill="none" stroke="#305b54" stroke-width="3" stroke-linejoin="round"/><rect x="320" y="130" width="45" height="100" fill="#e9dcc4" stroke="#305b54" stroke-width="1.3"/><path d="M342.00 122.00L342.00 65.00" fill="none" stroke="#bc8c4d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="400.00" y="90.00" fill="#305b54" font-size="22" text-anchor="middle">升程 z(t)</text><path d="M425.00 180.00L585.00 180.00" fill="none" stroke="#298999" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="550.00" y="140.00" fill="#305b54" font-size="21" text-anchor="middle">质量流量</text><text x="580.00" y="242.00" fill="#305b54" font-size="21" text-anchor="middle">下游 pout(t)</text><text x="360.00" y="320.00" fill="#305b54" font-size="20" text-anchor="middle">压力 → 受力与位移 → 流通面积 → 流量与压力</text></g></svg>