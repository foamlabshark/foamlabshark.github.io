<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title"><title id="title">泵叶轮的速度三角形与角度约定</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="720" height="390" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M100.00 285.00L600.00 285.00" fill="none" stroke="#bc8c4d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M600.00 285.00L350.00 100.00" fill="none" stroke="#298999" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M100.00 285.00L350.00 100.00" fill="none" stroke="#305b54" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M350.00 100.00L350.00 285.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="470.00" y="322.00" fill="#bc8c4d" font-size="26" text-anchor="middle">U</text><text x="510.00" y="174.00" fill="#298999" font-size="26" text-anchor="middle">W</text><text x="185.00" y="172.00" fill="#305b54" font-size="26" text-anchor="middle">C</text><path d="M545 285A55 55 0 0 1 556 252" fill="none" stroke="#bc8c4d" stroke-width="2" stroke-linejoin="round"/><text x="516.00" y="270.00" fill="#305b54" font-size="24" text-anchor="middle">β</text><path d="M100.00 330.00L350.00 330.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="225.00" y="363.00" fill="#305b54" font-size="22" text-anchor="middle">Cθ = U − W cosβ</text><text x="365.00" y="54.00" fill="#305b54" font-size="22" text-anchor="middle">绝对速度 = 叶片速度 + 相对速度</text></g></svg>