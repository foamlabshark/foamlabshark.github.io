<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 390" role="img" aria-labelledby="title"><title id="title">两相在共同叶片速度下的不同速度三角形</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="750" height="390" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M90.00 285.00L630.00 285.00" fill="none" stroke="#bc8c4d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="565.00" y="325.00" fill="#bc8c4d" font-size="22" text-anchor="middle">共同的 U</text><path d="M630.00 285.00L395.00 135.00" fill="none" stroke="#298999" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M90.00 285.00L395.00 135.00" fill="none" stroke="#298999" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="395.00" y="117.00" fill="#298999" font-size="23" text-anchor="middle">相 1</text><path d="M395.00 135.00L395.00 285.00" fill="none" stroke="#298999" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M630.00 285.00L255.00 70.00" fill="none" stroke="#925b70" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M90.00 285.00L255.00 70.00" fill="none" stroke="#925b70" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="255.00" y="52.00" fill="#925b70" font-size="23" text-anchor="middle">相 2</text><path d="M255.00 70.00L255.00 285.00" fill="none" stroke="#925b70" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="360.00" y="360.00" fill="#305b54" font-size="20" text-anchor="middle">各相相对速度 W 不同，绝对圆周分量 Cθ 随之改变</text></g></svg>