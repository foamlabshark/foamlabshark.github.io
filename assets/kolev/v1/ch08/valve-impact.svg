<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">恢复系数控制碰撞后的速度与动能</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="720" height="360" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M70.00 280.00L660.00 280.00" fill="none" stroke="#305b54" stroke-width="4" stroke-linejoin="round"/><text x="620.00" y="318.00" fill="#305b54" font-size="20" text-anchor="middle">阀座 z = 0</text><path d="M100 80L300 280L500 180" fill="none" stroke="#298999" stroke-width="2.5" stroke-linejoin="round"/><text x="140.00" y="115.00" fill="#305b54" font-size="20" text-anchor="middle">碰撞前 v⁻ &lt; 0</text><text x="490.00" y="142.00" fill="#305b54" font-size="21" text-anchor="middle">碰撞后 v⁺ = −er v⁻</text><circle cx="300" cy="280" r="6" fill="#bc8c4d" stroke="#305b54" stroke-width="1.4"/><path d="M300.00 280.00L300.00 50.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="300.00" y="35.00" fill="#305b54" font-size="21" text-anchor="middle">碰撞时刻</text><text x="300.00" y="345.00" fill="#305b54" font-size="21" text-anchor="middle">碰撞前后：位置连续，速度跳变</text></g></svg>