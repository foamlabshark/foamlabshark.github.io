<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">相变等量质量对应的不同体积响应</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="70" y="105" width="150" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="490" y="105" width="200" height="180" fill="#f5f7f1" stroke="#305b54" stroke-width="1.3"/><rect x="70" y="230" width="150" height="55" fill="#94bdb7" stroke="#305b54" stroke-width="1.3"/><text x="145" y="195" fill="#305b54" font-size="24" text-anchor="middle">液体</text><text x="590" y="195" fill="#305b54" font-size="24" text-anchor="middle">蒸气</text><path d="M245.00 195.00L465.00 195.00" fill="none" stroke="#bc8c4d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="165" fill="#bc8c4d" font-size="22" text-anchor="middle">同一质量 δm</text><text x="145" y="330" fill="#305b54" font-size="22" text-anchor="middle">减少 δm / ρ液</text><text x="590" y="330" fill="#305b54" font-size="22" text-anchor="middle">增加 δm / ρ汽</text><text x="380" y="55" fill="#305b54" font-size="24" text-anchor="middle">ρ汽 &lt; ρ液</text><text x="380" y="383" fill="#305b54" font-size="23" text-anchor="middle">净体积源 = ṁ (1/ρ汽 − 1/ρ液) &gt; 0</text></g></svg>