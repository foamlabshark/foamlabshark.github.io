<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">注入组成与同组成抽出对质量分数的作用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="275" y="90" width="210" height="220" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="275" y="222" width="210" height="88" fill="#bc8c4d" stroke="#305b54" stroke-width="1.3"/><text x="380" y="65" fill="#305b54" font-size="24" text-anchor="middle">当地组成 C</text><text x="380" y="180" fill="#305b54" font-size="23" text-anchor="middle">组分 B</text><text x="380" y="275" fill="#305b54" font-size="23" text-anchor="middle">组分 A</text><path d="M65.00 180.00L250.00 180.00" fill="none" stroke="#bc8c4d" stroke-width="6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="150" y="140" fill="#305b54" font-size="23" text-anchor="middle">流入 C_in</text><path d="M510.00 165.00L695.00 165.00" fill="none" stroke="#298999" stroke-width="5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M510.00 205.00L695.00 205.00" fill="none" stroke="#bc8c4d" stroke-width="3.3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="115" fill="#305b54" font-size="20" text-anchor="middle">按当地组成流出</text><text x="380" y="370" fill="#305b54" font-size="24" text-anchor="middle">组成源：S⁺ (C_in − C)</text></g></svg>