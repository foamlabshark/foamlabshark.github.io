<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">热量交换与冷热端的熵变化</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="70" y="100" width="185" height="175" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><rect x="505" y="100" width="185" height="175" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="162" y="150" fill="#305b54" font-size="24" text-anchor="middle">热端</text><text x="162" y="190" fill="#305b54" font-size="25" text-anchor="middle">400 K</text><text x="162" y="237" fill="#305b54" font-size="22" text-anchor="middle">−0.3 W/K</text><text x="597" y="150" fill="#305b54" font-size="24" text-anchor="middle">冷端</text><text x="597" y="190" fill="#305b54" font-size="25" text-anchor="middle">300 K</text><text x="597" y="237" fill="#305b54" font-size="22" text-anchor="middle">+0.4 W/K</text><path d="M275.00 185.00L485.00 185.00" fill="none" stroke="#b35d4b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="158" fill="#b35d4b" font-size="23" text-anchor="middle">Q̇ = 120 W</text><text x="380" y="340" fill="#305b54" font-size="25" text-anchor="middle">总熵产生：0.1 W/K</text></g></svg>