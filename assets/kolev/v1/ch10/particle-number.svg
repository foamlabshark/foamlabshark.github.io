<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">聚并与破碎中的球体数量和粒径关系</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><circle cx="145" cy="150" r="31" fill="#bc8c4d" stroke="#305b54" stroke-width="1.3"/><circle cx="145" cy="250" r="31" fill="#bc8c4d" stroke="#305b54" stroke-width="1.3"/><circle cx="550" cy="200" r="39.05755254674107" fill="#bc8c4d" stroke="#305b54" stroke-width="1.3"/><path d="M240.00 175.00L445.00 175.00" fill="none" stroke="#298999" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="340" y="148" fill="#305b54" font-size="23" text-anchor="middle">聚并</text><path d="M445.00 225.00L240.00 225.00" fill="none" stroke="#bc8c4d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="340" y="262" fill="#305b54" font-size="23" text-anchor="middle">破碎</text><text x="145" y="325" fill="#305b54" font-size="21" text-anchor="middle">2 个球：直径 d</text><text x="550" y="325" fill="#305b54" font-size="21" text-anchor="middle">1 个球：直径 2¹ᐟ³ d</text><text x="380" y="55" fill="#305b54" font-size="24" text-anchor="middle">材料总体积保持不变</text><text x="380" y="380" fill="#305b54" font-size="24" text-anchor="middle">α = n πd³ / 6</text></g></svg>