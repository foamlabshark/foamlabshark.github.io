<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">运动单元面的扫掠体积和质量变化</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="100" y="80" width="310" height="220" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="410" y="80" width="140" height="220" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><path d="M410.00 65.00L410.00 315.00" fill="none" stroke="#bc8c4d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M425.00 55.00L550.00 55.00" fill="none" stroke="#bc8c4d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="488" y="35" fill="#bc8c4d" font-size="22" text-anchor="middle">Vg Δt</text><text x="250" y="183" fill="#305b54" font-size="25" text-anchor="middle">静止流体</text><text x="250" y="218" fill="#305b54" font-size="21" text-anchor="middle">V = 0，ρ = 常量</text><text x="482" y="180" fill="#305b54" font-size="20" text-anchor="middle">扫掠体积</text><text x="482" y="215" fill="#305b54" font-size="21" text-anchor="middle">A Vg Δt</text><text x="250" y="340" fill="#305b54" font-size="20" text-anchor="middle">原单元</text><text x="482" y="340" fill="#305b54" font-size="20" text-anchor="middle">新增质量 ρ A Vg Δt</text><text x="380" y="383" fill="#305b54" font-size="23" text-anchor="middle">质量增量 = 密度 × 体积增量</text></g></svg>