<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">重复实特征值与特征向量完备性</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M380.00 60.00L380.00 310.00" fill="none" stroke="#b7cdc3" stroke-width="1.5"/><text x="190" y="70" fill="#305b54" font-size="28" text-anchor="middle">A = c I</text><text x="570" y="70" fill="#305b54" font-size="27" text-anchor="middle">A = [c, 1; 0, c]</text><path d="M90.00 120.00L90.00 245.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><path d="M290.00 120.00L290.00 245.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="90" y="110" fill="#305b54" font-size="25" text-anchor="middle">w₁</text><text x="290" y="110" fill="#305b54" font-size="25" text-anchor="middle">w₂</text><text x="190" y="285" fill="#305b54" font-size="24" text-anchor="middle">两个独立模式</text><path d="M490.00 120.00L490.00 245.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><path d="M650.00 120.00L650.00 245.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><path d="M640.00 170.00L505.00 170.00" fill="none" stroke="#bc8c4d" stroke-width="2" marker-end="url(#arrow)"/><text x="575" y="205" fill="#bc8c4d" font-size="23" text-anchor="middle">−∂z u₂</text><text x="490" y="110" fill="#305b54" font-size="25" text-anchor="middle">u₁</text><text x="650" y="110" fill="#305b54" font-size="25" text-anchor="middle">u₂</text><text x="570" y="285" fill="#305b54" font-size="22" text-anchor="middle">只有一个独立特征向量</text><text x="380" y="365" fill="#305b54" font-size="24" text-anchor="middle">两者的特征值均为 c、c</text></g></svg>