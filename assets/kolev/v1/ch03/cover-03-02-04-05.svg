<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">气体在水中的溶解平衡</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="90" y="70" width="280" height="210" fill="#eaf0ec" stroke="#305b54" stroke-width="1.5"/><rect x="90" y="175" width="280" height="105" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><path d="M90.00 175.00L370.00 175.00" fill="none" stroke="#298999" stroke-width="2.5"/><text x="230" y="120" font-size="22" text-anchor="middle" fill="#305b54" xml:space="preserve">气相：pᵢ</text><text x="230" y="235" font-size="22" text-anchor="middle" fill="#305b54" xml:space="preserve">液相：xᵢ</text><text x="510" y="130" font-size="21" text-anchor="middle" fill="#305b54" xml:space="preserve">μᵢ,g = μᵢ,aq</text><text x="510" y="220" font-size="21" text-anchor="middle" fill="#305b54" xml:space="preserve">pᵢ = Hᵢ xᵢ</text><text x="350" y="325" font-size="18" text-anchor="middle" fill="#305b54" xml:space="preserve">界面平衡浓度由气相分压力确定</text></g></svg>