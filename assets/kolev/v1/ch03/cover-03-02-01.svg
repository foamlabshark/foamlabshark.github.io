<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">组分分压力的计算</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="350" y="38" font-size="20" text-anchor="middle" fill="#305b54" xml:space="preserve">共同气相中的分压力</text><rect x="160" y="85" width="120" height="35" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><text x="125" y="110" font-size="20" text-anchor="middle" fill="#305b54" xml:space="preserve">p₁</text><rect x="160" y="155" width="210" height="35" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><text x="125" y="180" font-size="20" text-anchor="middle" fill="#305b54" xml:space="preserve">p₂</text><rect x="160" y="225" width="330" height="35" fill="#e4d4bc" stroke="#305b54" stroke-width="1.5"/><text x="125" y="250" font-size="20" text-anchor="middle" fill="#305b54" xml:space="preserve">p</text><text x="350" y="323" font-size="20" text-anchor="middle" fill="#305b54" xml:space="preserve">p = p₁ + p₂    pₘ / p = Yₘ</text></g></svg>