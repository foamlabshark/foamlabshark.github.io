<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">混合物的质量与体积基准</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="65" y="55" width="350" height="230" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><text x="240" y="34" font-size="17" text-anchor="middle" fill="#305b54" xml:space="preserve">总体积 V</text><circle cx="130" cy="115" r="23" fill="#bc8c4d" stroke="#305b54" stroke-width="1.4"/><circle cx="300" cy="215" r="30" fill="#bc8c4d" stroke="#305b54" stroke-width="1.4"/><circle cx="340" cy="110" r="27" fill="#bc8c4d" stroke="#305b54" stroke-width="1.4"/><circle cx="180" cy="230" r="20" fill="#bc8c4d" stroke="#305b54" stroke-width="1.4"/><text x="240" y="174" font-size="19" text-anchor="middle" fill="#305b54" xml:space="preserve">气体共享空间 Vᶠ</text><path d="M340.00 110.00L475.00 92.00" fill="none" stroke="#bc8c4d" stroke-width="1.5"/><text x="485" y="96" font-size="18" text-anchor="start" fill="#305b54" xml:space="preserve">颗粒：mₙ / ρₙ</text><path d="M340.00 174.00L475.00 188.00" fill="none" stroke="#298999" stroke-width="1.5"/><text x="485" y="191" font-size="17" text-anchor="start" fill="#305b54" xml:space="preserve">组分：rₘ = mₘ / Vᶠ</text><text x="350" y="326" font-size="21" text-anchor="middle" fill="#305b54" xml:space="preserve">V = Vᶠ + Σ Vₙ</text></g></svg>