<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">热泵从低温侧取热并向高温侧供热</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="720" height="360" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="30" y="105" width="180" height="145" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><rect x="275" y="125" width="170" height="105" fill="#ece4d5" stroke="#305b54" stroke-width="1.4"/><rect x="510" y="105" width="180" height="145" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><text x="120.00" y="150.00" fill="#305b54" font-size="22" text-anchor="middle">低温侧</text><text x="120.00" y="195.00" fill="#305b54" font-size="20" text-anchor="middle">Tc = 300 K</text><text x="600.00" y="150.00" fill="#305b54" font-size="22" text-anchor="middle">高温侧</text><text x="600.00" y="195.00" fill="#305b54" font-size="20" text-anchor="middle">Th = 320 K</text><text x="360.00" y="185.00" fill="#305b54" font-size="25" text-anchor="middle">热泵</text><path d="M210.00 175.00L267.00 175.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="243.00" y="86.00" fill="#305b54" font-size="18" text-anchor="middle">Qc = 9 kW</text><path d="M445.00 175.00L502.00 175.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="475.00" y="86.00" fill="#305b54" font-size="18" text-anchor="middle">Qh = 12 kW</text><path d="M360.00 325.00L360.00 240.00" fill="none" stroke="#305b54" stroke-width="3" marker-end="url(#arrow)"/><text x="495.00" y="310.00" fill="#305b54" font-size="22" text-anchor="middle">Win = 3 kW</text></g></svg>