<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 375" role="img" aria-labelledby="title"><title id="title">两场内部传热的熵产生与㶲毁灭</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="750" height="375" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="70" y="80" width="205" height="155" fill="#ece4d5" stroke="#305b54" stroke-width="1.4"/><rect x="445" y="80" width="205" height="155" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><text x="173.00" y="135.00" fill="#305b54" font-size="25" text-anchor="middle">热场 Th</text><text x="173.00" y="190.00" fill="#305b54" font-size="26" text-anchor="middle">−Q</text><text x="547.00" y="135.00" fill="#305b54" font-size="25" text-anchor="middle">冷场 Tc</text><text x="547.00" y="190.00" fill="#305b54" font-size="26" text-anchor="middle">+Q</text><path d="M290.00 155.00L430.00 155.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="360.00" y="125.00" fill="#305b54" font-size="20" text-anchor="middle">Q &gt; 0</text><text x="360.00" y="292.00" fill="#305b54" font-size="22" text-anchor="middle">总能量交换 = 0</text><text x="360.00" y="335.00" fill="#305b54" font-size="24" text-anchor="middle">㶲毁灭 = T₀ Q (1/Tc − 1/Th) &gt; 0</text></g></svg>