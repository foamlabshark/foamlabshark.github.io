<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">实验室波速与随波参考系通过速度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="55" y="105" width="640" height="140" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><path d="M380.00 75.00L380.00 280.00" fill="none" stroke="#b35d4b" stroke-width="3" stroke-linejoin="round"/><text x="220" y="80" fill="#305b54" font-size="23" text-anchor="middle">波后 2</text><text x="540" y="80" fill="#305b54" font-size="23" text-anchor="middle">波前 1</text><text x="220" y="150" fill="#305b54" font-size="24" text-anchor="middle">p₂，ρ₂，u₂</text><text x="540" y="150" fill="#305b54" font-size="24" text-anchor="middle">p₁，ρ₁，u₁</text><path d="M405.00 45.00L545.00 45.00" fill="none" stroke="#b35d4b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="30" fill="#b35d4b" font-size="20" text-anchor="middle">波速 D</text><path d="M270.00 205.00L150.00 205.00" fill="none" stroke="#298999" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M640.00 205.00L460.00 205.00" fill="none" stroke="#298999" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="220" y="278" fill="#305b54" font-size="21" text-anchor="middle">w₂ = D − u₂</text><text x="540" y="278" fill="#305b54" font-size="21" text-anchor="middle">w₁ = D − u₁</text><text x="375" y="333" fill="#305b54" font-size="21" text-anchor="middle">随波参考系：流体从右向左通过波层</text><text x="375" y="370" fill="#305b54" font-size="22" text-anchor="middle">质量通量相同：ρ₁w₁ = ρ₂w₂</text></g></svg>