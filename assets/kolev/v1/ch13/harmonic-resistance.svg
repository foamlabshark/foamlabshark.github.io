<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title"><title id="title">两段扩散介质的串联阻力</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="430" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="120" y="85" width="250" height="200" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="370" y="85" width="250" height="200" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><text x="245" y="65" fill="#305b54" font-size="25" text-anchor="middle">ΦP = 1</text><text x="495" y="65" fill="#305b54" font-size="25" text-anchor="middle">ΦN = 4</text><path d="M120.00 270.00L370.00 126.00L620.00 90.00" fill="none" stroke="#298999" stroke-width="3"/><text x="380" y="325" fill="#305b54" font-size="24" text-anchor="middle">相同长度：低 Φ 一侧落差更大</text><path d="M470.00 360.00L275.00 360.00" fill="none" stroke="#bc8c4d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="400" fill="#305b54" font-size="23" text-anchor="middle">两侧具有同一扩散通量</text></g></svg>