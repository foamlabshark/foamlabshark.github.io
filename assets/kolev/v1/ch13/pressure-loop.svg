<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">压力与各场质量的迭代关系</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="410" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="95" y="70" width="210" height="90" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="200" y="125" fill="#305b54" font-size="25" text-anchor="middle">压力</text><rect x="455" y="70" width="210" height="90" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="560" y="125" fill="#305b54" font-size="25" text-anchor="middle">面速度</text><rect x="455" y="240" width="210" height="90" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="560" y="295" fill="#305b54" font-size="25" text-anchor="middle">各场质量</text><rect x="95" y="240" width="210" height="90" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="200" y="295" fill="#305b54" font-size="25" text-anchor="middle">密度与热状态</text><path d="M310.00 115.00L450.00 115.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560.00 165.00L560.00 235.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M450.00 285.00L310.00 285.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M200.00 235.00L200.00 165.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="385" fill="#305b54" font-size="22" text-anchor="middle">逐场质量残差与体积约束共同收敛</text></g></svg>