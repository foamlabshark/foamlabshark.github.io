<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">y向动量穿过x法向面</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="150" y="105" width="220" height="190" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><path d="M375.00 105.00L375.00 295.00" fill="none" stroke="#305b54" stroke-width="3"/><path d="M375.00 205.00L435.00 205.00" fill="none" stroke="#bc8c4d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="510" y="211" fill="#bc8c4d" font-size="25" text-anchor="middle">n = ex</text><path d="M375.00 205.00L375.00 125.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="565" y="120" fill="#298999" font-size="27" text-anchor="middle">τyx</text><text x="380" y="355" fill="#305b54" font-size="25" text-anchor="middle">τyx = μ (vx + uy) = τxy</text></g></svg>