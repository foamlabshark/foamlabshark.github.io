<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">x向动量穿过y法向面</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="150" y="120" width="220" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><path d="M150.00 115.00L370.00 115.00" fill="none" stroke="#305b54" stroke-width="3"/><path d="M260.00 115.00L260.00 65.00" fill="none" stroke="#bc8c4d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="260" y="45" fill="#bc8c4d" font-size="25" text-anchor="middle">n = ey</text><path d="M260.00 115.00L350.00 115.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="155" fill="#305b54" font-size="25" text-anchor="middle">τxy = μ (uy + vx)</text><text x="525" y="245" fill="#305b54" font-size="24" text-anchor="middle">输出动量：x</text><text x="380" y="365" fill="#305b54" font-size="23" text-anchor="middle">牵引沿 x，面的法向沿 y</text></g></svg>