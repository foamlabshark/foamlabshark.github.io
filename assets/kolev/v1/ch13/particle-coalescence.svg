<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title"><title id="title">颗粒聚并的体积和表面积关系</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="370" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><circle cx="150" cy="185" r="50" fill="#dcecea" stroke="#305b54" stroke-width="2"/><circle cx="290" cy="185" r="50" fill="#dcecea" stroke="#305b54" stroke-width="2"/><circle cx="580" cy="185" r="62.99605249474366" fill="#dcecea" stroke="#305b54" stroke-width="2"/><path d="M370.00 185.00L480.00 185.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><text x="220" y="75" fill="#305b54" font-size="26" text-anchor="middle">两颗：直径 d</text><text x="580" y="75" fill="#305b54" font-size="26" text-anchor="middle">一颗：直径 2¹ᐟ³ d</text><text x="380" y="325" fill="#305b54" font-size="23" text-anchor="middle">总体积不变；总表面积降为 2⁻¹ᐟ³ 倍</text></g></svg>