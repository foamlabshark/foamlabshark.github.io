<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">按注入动量率确定速度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="410" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="430" y="100" width="220" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="540" y="175" fill="#305b54" font-size="26" text-anchor="middle">等效注入</text><text x="540" y="225" fill="#305b54" font-size="26" text-anchor="middle">Uin = 5 m/s</text><path d="M100.00 125.00L420.00 150.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><path d="M100.00 270.00L420.00 240.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="215" y="95" fill="#305b54" font-size="24" text-anchor="middle">1 kg/s，2 m/s</text><text x="215" y="315" fill="#305b54" font-size="24" text-anchor="middle">3 kg/s，6 m/s</text><text x="380" y="380" fill="#305b54" font-size="23" text-anchor="middle">动量率 20 N ÷ 质量率 4 kg/s</text></g></svg>