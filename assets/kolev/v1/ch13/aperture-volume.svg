<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title"><title id="title">开口面积与可用体积的独立定义</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="410" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="80" y="100" width="220" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="80" y="100" width="220" height="65" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><path d="M40.00 222.00L120.00 222.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="70" fill="#305b54" font-size="26" text-anchor="middle">面开口</text><text x="190" y="320" fill="#305b54" font-size="22" text-anchor="middle">γf = 开口面积 / 面积</text><polygon points="470.00,140.00 645.00,140.00 705.00,80.00 530.00,80.00" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><polygon points="470.00,140.00 645.00,140.00 645.00,270.00 470.00,270.00" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><polygon points="645.00,140.00 705.00,80.00 705.00,210.00 645.00,270.00" fill="#cee0da" stroke="#305b54" stroke-width="1.5"/><rect x="500" y="140" width="60" height="130" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><text x="590" y="50" fill="#305b54" font-size="26" text-anchor="middle">单元内障碍物</text><text x="590" y="320" fill="#305b54" font-size="22" text-anchor="middle">γv = 可用体积 / 体积</text><text x="380" y="380" fill="#305b54" font-size="22" text-anchor="middle">橙色：固体；浅绿：流体可用部分</text></g></svg>