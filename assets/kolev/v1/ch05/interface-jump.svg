<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">界面法向、质量通量与潜热收支</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="70" y="75" width="280" height="190" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="350" y="75" width="280" height="190" fill="#e9eee3" stroke="#305b54" stroke-width="1.3"/><path d="M350.00 55.00L350.00 280.00" fill="none" stroke="#305b54" stroke-width="2"/><text x="190" y="115" fill="#305b54" font-size="19" text-anchor="middle">液体 l</text><text x="510" y="115" fill="#305b54" font-size="19" text-anchor="middle">蒸气 m</text><text x="350" y="35" fill="#305b54" font-size="19" text-anchor="middle">界面静止参考系</text><path d="M160.00 165.00L535.00 165.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="150" fill="#305b54" font-size="19" text-anchor="middle">j &gt; 0</text><path d="M150.00 225.00L330.00 225.00" fill="none" stroke="#bc8c4d" stroke-width="2" marker-end="url(#arrow)"/><path d="M370.00 225.00L490.00 225.00" fill="none" stroke="#bc8c4d" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="252" fill="#305b54" font-size="18" text-anchor="middle">qₗ · n</text><text x="430" y="252" fill="#305b54" font-size="18" text-anchor="middle">qₘ · n</text><path d="M350.00 292.00L425.00 292.00" fill="none" stroke="#305b54" stroke-width="1.5" marker-end="url(#arrow)"/><text x="445" y="298" fill="#305b54" font-size="18" text-anchor="middle">n</text><text x="350" y="332" fill="#305b54" font-size="21" text-anchor="middle">j (hₘ − hₗ) = (qₗ − qₘ) · n</text></g></svg>