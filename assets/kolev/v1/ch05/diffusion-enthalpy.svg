<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">相反组分通量与非零净焓输运</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="80" y="80" width="540" height="185" fill="none" stroke="#305b54" stroke-width="1.3"/><path d="M350.00 65.00L350.00 280.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-dasharray="6 5"/><text x="350" y="42" fill="#305b54" font-size="18" text-anchor="middle">同一截面</text><path d="M160.00 135.00L535.00 135.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="115" fill="#305b54" font-size="20" text-anchor="middle">J₂ = +0.01 kg/(m²·s)</text><path d="M535.00 215.00L160.00 215.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="245" fill="#305b54" font-size="20" text-anchor="middle">J₁ = −0.01 kg/(m²·s)</text><text x="350" y="182" fill="#305b54" font-size="19" text-anchor="middle">h₂ − h₁ = 2 × 10⁵ J/kg</text><text x="350" y="318" fill="#305b54" font-size="19" text-anchor="middle">净质量通量 = 0；净焓通量 = 2000 W/m² →</text></g></svg>