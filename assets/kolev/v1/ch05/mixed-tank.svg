<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">集中参数容积的边界收支</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="190" y="70" width="320" height="215" fill="none" stroke="#305b54" stroke-width="1.3"/><rect x="190" y="193" width="320" height="92" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="350" y="125" fill="#305b54" font-size="21" text-anchor="middle">p(t), T₁(t)</text><text x="350" y="245" fill="#305b54" font-size="21" text-anchor="middle">T₂(t), α₂(t)</text><path d="M55.00 125.00L180.00 125.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><text x="110" y="95" fill="#305b54" font-size="17" text-anchor="middle">入口 ṁin hin</text><path d="M520.00 243.00L650.00 243.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><text x="588" y="280" fill="#305b54" font-size="17" text-anchor="middle">出口 ṁout hout</text><path d="M350.00 30.00L350.00 62.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="38" fill="#305b54" font-size="22" text-anchor="middle">Q̇</text><text x="350" y="330" fill="#305b54" font-size="17" text-anchor="middle">内部状态均匀，边界质量与能量通量仍保留</text></g></svg>