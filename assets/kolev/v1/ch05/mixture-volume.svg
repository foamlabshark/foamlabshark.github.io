<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">相变导致的体积变化与压力约束</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="65" y="65" width="260" height="220" fill="none" stroke="#305b54" stroke-width="1.3"/><rect x="65" y="213" width="260" height="72" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="195" y="110" fill="#305b54" font-size="20" text-anchor="middle">气体</text><text x="195" y="250" fill="#305b54" font-size="20" text-anchor="middle">液体</text><path d="M195.00 210.00L195.00 160.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="242" y="195" fill="#305b54" font-size="21" text-anchor="middle">Γ</text><path d="M350.00 170.00L415.00 170.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="65" width="195" height="220" fill="none" stroke="#305b54" stroke-width="1.3"/><rect x="440" y="242" width="195" height="43" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><path d="M460.00 100.00L615.00 100.00" fill="none" stroke="#bc8c4d" stroke-width="2" marker-end="url(#arrow)"/><text x="538" y="145" fill="#305b54" font-size="19" text-anchor="middle">压力响应</text><text x="538" y="183" fill="#305b54" font-size="19" text-anchor="middle">或体积流出</text><text x="350" y="330" fill="#305b54" font-size="22" text-anchor="middle">ΔV̇ / V = Γ (1/ρg − 1/ρℓ)</text></g></svg>