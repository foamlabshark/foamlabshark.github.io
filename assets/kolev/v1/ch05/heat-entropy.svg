<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">两场热交换中的能量配对和熵产生</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="85" y="90" width="185" height="145" fill="#e9dec9" stroke="#305b54" stroke-width="1.3"/><rect x="430" y="90" width="185" height="145" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="178" y="145" fill="#305b54" font-size="20" text-anchor="middle">热场</text><text x="178" y="185" fill="#305b54" font-size="20" text-anchor="middle">T₂ = 400 K</text><text x="522" y="145" fill="#305b54" font-size="20" text-anchor="middle">冷场</text><text x="522" y="185" fill="#305b54" font-size="20" text-anchor="middle">T₁ = 300 K</text><path d="M280.00 162.00L420.00 162.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="130" fill="#305b54" font-size="18" text-anchor="middle">Q = K(T₂ − T₁)</text><text x="350" y="288" fill="#305b54" font-size="23" text-anchor="middle">ΔṠ = Q/T₁ − Q/T₂ &gt; 0</text><text x="350" y="325" fill="#305b54" font-size="18" text-anchor="middle">两场能量交换相消，总熵增加</text></g></svg>