<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">组分质量源与注入焓</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="270" y="95" width="270" height="175" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><text x="405" y="143" fill="#305b54" font-size="20" text-anchor="middle" xml:space="preserve">混合体积</text><text x="405" y="190" fill="#305b54" font-size="20" text-anchor="middle" xml:space="preserve">ρ，T，C₁…Cₙ</text><text x="405" y="237" fill="#305b54" font-size="20" text-anchor="middle" xml:space="preserve">h = Σ Cᵢhᵢ</text><path d="M75.00 132.00L250.00 132.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="155" y="113" fill="#305b54" font-size="20" text-anchor="middle" xml:space="preserve">q₁，h₁ⁱⁿ</text><path d="M75.00 228.00L250.00 228.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="155" y="209" fill="#305b54" font-size="20" text-anchor="middle" xml:space="preserve">q₂，h₂ⁱⁿ</text><text x="350" y="321" fill="#305b54" font-size="21" text-anchor="middle" xml:space="preserve">ρ DCᵢ / Dt = qᵢ − CᵢΣqⱼ</text></g></svg>