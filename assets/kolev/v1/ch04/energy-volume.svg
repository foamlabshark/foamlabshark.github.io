<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">固定控制体的总能量输运</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="195" y="88" width="310" height="180" fill="none" stroke="#305b54" stroke-width="1.5"/><text x="350" y="132" fill="#305b54" font-size="19" text-anchor="middle" xml:space="preserve">固定控制体 V</text><text x="350" y="185" fill="#305b54" font-size="21" text-anchor="middle" xml:space="preserve">ρE = ρe + ½ρ|u|²</text><path d="M60.00 170.00L180.00 170.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><path d="M520.00 170.00L640.00 170.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="110" y="136" fill="#305b54" font-size="18" text-anchor="middle" xml:space="preserve">流入</text><text x="580" y="136" fill="#305b54" font-size="18" text-anchor="middle" xml:space="preserve">流出</text><path d="M505.00 238.00L570.00 238.00" fill="none" stroke="#bc8c4d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="585" y="243" fill="#305b54" font-size="18" text-anchor="middle" xml:space="preserve">n</text><text x="350" y="318" fill="#305b54" font-size="21" text-anchor="middle" xml:space="preserve">能量通量  (ρE + p)u</text></g></svg>