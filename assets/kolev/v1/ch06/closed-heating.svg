<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">固定质量气体的定容热输入</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="720" height="360" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="245" y="70" width="310" height="195" fill="none" stroke="#305b54" stroke-width="1.4"/><text x="400.00" y="125.00" fill="#305b54" font-size="20" text-anchor="middle">质量、容积不变</text><text x="400.00" y="185.00" fill="#305b54" font-size="25" text-anchor="middle">ρcv dT/dt = qv</text><path d="M65.00 168.00L230.00 168.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="143.00" y="136.00" fill="#305b54" font-size="20" text-anchor="middle">热输入 qvV</text><text x="360.00" y="320.00" fill="#305b54" font-size="26" text-anchor="middle">Δp = (γ − 1) ∫ qv dt</text></g></svg>