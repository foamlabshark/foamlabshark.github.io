<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title"><title id="title">氢氧反应按近似摩尔质量计算的质量收支</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="720" height="360" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="80" y="130" width="24" height="110" fill="#298999" stroke="#305b54" stroke-width="1.4"/><text x="92.00" y="110.00" fill="#305b54" font-size="23" text-anchor="middle">氢：1</text><rect x="200" y="130" width="192" height="110" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><text x="296.00" y="110.00" fill="#305b54" font-size="23" text-anchor="middle">氧：8</text><rect x="470" y="130" width="216" height="110" fill="#bc8c4d" stroke="#305b54" stroke-width="1.4"/><text x="578.00" y="110.00" fill="#305b54" font-size="23" text-anchor="middle">水：9</text><text x="150.00" y="194.00" fill="#305b54" font-size="30" text-anchor="middle">+</text><path d="M410.00 184.00L455.00 184.00" fill="none" stroke="#305b54" stroke-width="2" marker-end="url(#arrow)"/><text x="360.00" y="305.00" fill="#305b54" font-size="24" text-anchor="middle">1 kg H₂ + 8 kg O₂ → 9 kg H₂O</text></g></svg>