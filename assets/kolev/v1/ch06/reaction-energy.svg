<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 340" role="img" aria-labelledby="title"><title id="title">共用反应进度的质量与能量更新</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="750" height="340" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="265" y="40" width="210" height="65" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><text x="370.00" y="80.00" fill="#305b54" font-size="22" text-anchor="middle">同一反应进度 x</text><path d="M370.00 105.00L140.00 180.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="190" width="210" height="100" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><text x="140.00" y="225.00" fill="#305b54" font-size="22" text-anchor="middle">质量分数</text><text x="140.00" y="264.00" fill="#305b54" font-size="18" text-anchor="middle">按化学计量更新</text><path d="M370.00 105.00L370.00 180.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="190" width="210" height="100" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><text x="370.00" y="225.00" fill="#305b54" font-size="22" text-anchor="middle">总内能</text><text x="370.00" y="264.00" fill="#305b54" font-size="18" text-anchor="middle">Σ Cᵢ eᵢ(T) = e₀</text><path d="M370.00 105.00L600.00 180.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="190" width="210" height="100" fill="#dcecea" stroke="#305b54" stroke-width="1.4"/><text x="600.00" y="225.00" fill="#305b54" font-size="22" text-anchor="middle">压力</text><text x="600.00" y="264.00" fill="#305b54" font-size="18" text-anchor="middle">p = ρ R(C) T</text></g></svg>