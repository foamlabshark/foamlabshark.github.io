<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">旋转与平移的顺序</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M108.00 315.00L624.00 315.00" fill="none" stroke="#305b54" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180.00 340.50L180.00 17.50" fill="none" stroke="#305b54" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="300" cy="315" r="5" fill="#305b54"/><text x="300" y="350" fill="#305b54" font-size="21" text-anchor="middle">P = (1,0)</text><circle cx="180" cy="230" r="5" fill="#305b54"/><text x="140" y="230" fill="#305b54" font-size="21" text-anchor="middle">RP</text><circle cx="420" cy="230" r="5" fill="#305b54"/><text x="450" y="215" fill="#305b54" font-size="21" text-anchor="middle">TRP = (2,1)</text><circle cx="540" cy="315" r="5" fill="#305b54"/><text x="565" y="350" fill="#305b54" font-size="21" text-anchor="middle">TP</text><circle cx="180" cy="60" r="5" fill="#305b54"/><text x="290" y="60" fill="#305b54" font-size="21" text-anchor="middle">RTP = (0,3)</text><path d="M300 315 Q300 230 180 230" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180.00 230.00L420.00 230.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M300.00 315.00L540.00 315.00" fill="none" stroke="#bc8c4d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 315 Q540 60 180 60" fill="none" stroke="#bc8c4d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="600" y="65" fill="#305b54" font-size="23" text-anchor="middle">R：逆时针 90°</text><text x="600" y="100" fill="#305b54" font-size="23" text-anchor="middle">T：向右平移 2</text></g></svg>