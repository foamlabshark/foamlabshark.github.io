<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">两个区域的质量加权中心</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><polygon points="100.00,105.00 255.00,125.00 230.00,255.00 85.00,240.00" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><polygon points="460.00,80.00 670.00,100.00 680.00,275.00 450.00,265.00" fill="#e9dac2" stroke="#305b54" stroke-width="1.5"/><path d="M175.00 185.00L565.00 185.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="175" cy="185" r="4" fill="#305b54"/><circle cx="565" cy="185" r="4" fill="#305b54"/><circle cx="435" cy="185" r="6" fill="#298999"/><text x="175" y="70" fill="#305b54" font-size="25" text-anchor="middle">m₁ = 1</text><text x="565" y="55" fill="#305b54" font-size="25" text-anchor="middle">m₂ = 2</text><text x="175" y="305" fill="#305b54" font-size="26" text-anchor="middle">c₁</text><text x="565" y="315" fill="#305b54" font-size="26" text-anchor="middle">c₂</text><text x="435" y="155" fill="#298999" font-size="23" text-anchor="middle">组合中心</text><text x="380" y="365" fill="#305b54" font-size="24" text-anchor="middle">rc = (c₁ + 2c₂) / 3</text></g></svg>