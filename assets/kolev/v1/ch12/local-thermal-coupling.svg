<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">局部隐式换热的成对能量交换</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="90" y="100" width="210" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="460" y="100" width="210" height="180" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><text x="195" y="150" fill="#305b54" font-size="24" text-anchor="middle">热容量 C₁</text><text x="195" y="215" fill="#305b54" font-size="24" text-anchor="middle">温度 T₁</text><text x="565" y="150" fill="#305b54" font-size="24" text-anchor="middle">热容量 C₂</text><text x="565" y="215" fill="#305b54" font-size="24" text-anchor="middle">温度 T₂</text><path d="M320.00 165.00L440.00 165.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M440.00 220.00L320.00 220.00" fill="none" stroke="#bc8c4d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="80" fill="#305b54" font-size="24" text-anchor="middle">H (T₂ − T₁)</text><text x="380" y="350" fill="#305b54" font-size="25" text-anchor="middle">C₁ T₁ + C₂ T₂ 保持不变</text></g></svg>