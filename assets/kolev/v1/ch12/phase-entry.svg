<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">新相进入空单元的质量与状态来源</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="65" y="90" width="250" height="200" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="445" y="90" width="250" height="200" fill="#f5f7f1" stroke="#305b54" stroke-width="1.3"/><text x="190" y="150" fill="#305b54" font-size="24" text-anchor="middle">邻居含有场 l</text><text x="570" y="150" fill="#305b54" font-size="23" text-anchor="middle">当前场质量原为 0</text><path d="M250.00 215.00L510.00 215.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="188" fill="#298999" font-size="22" text-anchor="middle">流入质量 B⁻</text><text x="190" y="260" fill="#305b54" font-size="25" text-anchor="middle">ρ、T、C</text><text x="570" y="260" fill="#305b54" font-size="22" text-anchor="middle">由流入收支确定</text><text x="380" y="355" fill="#305b54" font-size="22" text-anchor="middle">q新 = Δt × 流入率 / 储存与流出系数</text></g></svg>