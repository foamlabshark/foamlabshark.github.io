<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">两个面的独立供体选择</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="95" y="110" width="190" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="190" y="175" fill="#305b54" font-size="26" text-anchor="middle">W</text><text x="190" y="235" fill="#305b54" font-size="24" text-anchor="middle">φW</text><rect x="285" y="110" width="190" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="380" y="175" fill="#305b54" font-size="26" text-anchor="middle">P</text><text x="380" y="235" fill="#305b54" font-size="24" text-anchor="middle">φP</text><rect x="475" y="110" width="190" height="180" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="570" y="175" fill="#305b54" font-size="26" text-anchor="middle">E</text><text x="570" y="235" fill="#305b54" font-size="24" text-anchor="middle">φE</text><path d="M230.00 75.00L345.00 75.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="285" y="52" fill="#305b54" font-size="22" text-anchor="middle">w 面</text><path d="M420.00 75.00L535.00 75.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="475" y="52" fill="#305b54" font-size="22" text-anchor="middle">e 面</text><text x="380" y="345" fill="#305b54" font-size="23" text-anchor="middle">Fw &gt; 0：取 φW；Fe &gt; 0：取 φP</text></g></svg>