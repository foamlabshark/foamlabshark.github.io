<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">两端压力对均匀管段内部压力的权重</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M100.00 320.00L670.00 320.00" fill="none" stroke="#305b54" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M100.00 330.00L100.00 45.00" fill="none" stroke="#305b54" stroke-width="1.5" marker-end="url(#arrow)"/><text x="685" y="348" fill="#305b54" font-size="19" text-anchor="middle">z / L</text><text x="80" y="52" fill="#305b54" font-size="22" text-anchor="end">权重</text><path d="M100.00 80.00L650.00 320.00" fill="none" stroke="#298999" stroke-width="3"/><path d="M100.00 320.00L650.00 80.00" fill="none" stroke="#bc8c4d" stroke-width="3"/><circle cx="237.5" cy="140.0" r="6" fill="#298999"/><circle cx="237.5" cy="260.0" r="6" fill="#bc8c4d"/><circle cx="375.0" cy="200.0" r="6" fill="#298999"/><circle cx="375.0" cy="200.0" r="6" fill="#bc8c4d"/><circle cx="512.5" cy="260.0" r="6" fill="#298999"/><circle cx="512.5" cy="140.0" r="6" fill="#bc8c4d"/><text x="235" y="68" fill="#298999" font-size="23" text-anchor="middle">入口权重 A</text><text x="530" y="68" fill="#bc8c4d" font-size="23" text-anchor="middle">出口权重 B</text><text x="380" y="380" fill="#305b54" font-size="22" text-anchor="middle">p(z) = A(z) p入口 + B(z) p出口；A + B = 1</text></g></svg>