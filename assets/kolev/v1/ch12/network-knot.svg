<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" role="img" aria-labelledby="title"><title id="title">结点统一向外的端口通量符号</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="435" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M100 215H380L650 100M380 215L610 330" fill="none" stroke="#305b54" stroke-width="4"/><circle cx="380" cy="215" r="14" fill="#bc8c4d"/><text x="380" y="175" fill="#305b54" font-size="25" text-anchor="middle">结点 J</text><path d="M290.00 215.00L185.00 215.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M455.00 183.00L555.00 141.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M455.00 252.00L545.00 298.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><text x="175" y="170" fill="#298999" font-size="22" text-anchor="middle">n₁ 向外</text><text x="590" y="65" fill="#298999" font-size="22" text-anchor="middle">n₂ 向外</text><text x="620" y="375" fill="#298999" font-size="22" text-anchor="middle">n₃ 向外</text><text x="155" y="275" fill="#305b54" font-size="19" text-anchor="middle">终点接入：q外 = −q管</text><text x="510" y="110" fill="#305b54" font-size="19" text-anchor="middle">起点接出：q外 = +q管</text><text x="370" y="410" fill="#305b54" font-size="20" text-anchor="middle">q外 统一以离开结点为正；q管 沿各管道点序为正</text></g></svg>