<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">压力和热质变化共同满足体积收支</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="250" y="110" width="260" height="190" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="380" y="160" fill="#305b54" font-size="27" text-anchor="middle">Σ αl = 1</text><text x="380" y="210" fill="#305b54" font-size="23" text-anchor="middle">单元体积约束</text><path d="M80.00 205.00L240.00 205.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="155" y="175" fill="#305b54" font-size="21" text-anchor="middle">面体积流入</text><path d="M520.00 205.00L680.00 205.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="175" fill="#305b54" font-size="21" text-anchor="middle">面体积流出</text><path d="M380.00 55.00L380.00 100.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="38" fill="#305b54" font-size="24" text-anchor="middle">压力变化 → 密度变化</text><path d="M380.00 350.00L380.00 310.00" fill="none" stroke="#b35d4b" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="383" fill="#305b54" font-size="24" text-anchor="middle">传热、组分改变与质量源</text></g></svg>