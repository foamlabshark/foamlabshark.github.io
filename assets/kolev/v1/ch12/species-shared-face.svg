<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">场质量与组分质量共用面通量</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="80" y="120" width="300" height="170" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="380" y="120" width="300" height="170" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><text x="220" y="170" fill="#305b54" font-size="27" text-anchor="middle">P</text><text x="530" y="170" fill="#305b54" font-size="27" text-anchor="middle">N</text><path d="M280.00 205.00L480.00 205.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="380" y="95" fill="#298999" font-size="25" text-anchor="middle">共同场质量流率 F</text><text x="230" y="255" fill="#305b54" font-size="24" text-anchor="middle">Ci,P</text><text x="535" y="255" fill="#305b54" font-size="24" text-anchor="middle">Ci,N</text><text x="380" y="350" fill="#305b54" font-size="25" text-anchor="middle">组分流率 = F Ci,供体 + 面扩散流率</text></g></svg>