<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title"><title id="title">恒角动量的周向速度随半径变化</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="430" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><circle cx="230" cy="210" r="160" fill="none" stroke="#b7cdc3" stroke-width="1.5"/><circle cx="230" cy="210" r="80" fill="none" stroke="#b7cdc3" stroke-width="1.5"/><path d="M230.00 210.00L390.00 210.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="230" cy="210" r="5" fill="#305b54"/><path d="M310.00 210.00L310.00 70.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><path d="M390.00 210.00L390.00 140.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="245" fill="#305b54" font-size="22" text-anchor="middle">r₁</text><text x="405" y="245" fill="#305b54" font-size="22" text-anchor="middle">r₂ = 2r₁</text><text x="283" y="105" fill="#298999" font-size="24" text-anchor="middle">v₁</text><text x="455" y="130" fill="#bc8c4d" font-size="24" text-anchor="middle">v₂ = v₁/2</text><text x="575" y="265" fill="#305b54" font-size="28" text-anchor="middle">r₁v₁ = r₂v₂</text><text x="380" y="400" fill="#305b54" font-size="24" text-anchor="middle">无外力矩：沿流线保持角动量 rv</text></g></svg>