<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">偏转角与倾角的不同基准</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><path d="M55 275H210L330 120" fill="none" stroke="#305b54" stroke-width="3"/><path d="M210.00 275.00L350.00 275.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M270 275A60 60 0 0 0 246.7 227.6" fill="none" stroke="#298999" stroke-width="2.5"/><text x="280" y="245" fill="#298999" font-size="25" text-anchor="middle">θ</text><path d="M90.00 275.00L160.00 275.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><path d="M240.00 236.00L285.00 178.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><text x="205" y="60" fill="#305b54" font-size="23" text-anchor="middle">前、后管轴之间</text><path d="M490.00 300.00L490.00 90.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M490.00 300.00L660.00 130.00" fill="none" stroke="#305b54" stroke-width="3" marker-end="url(#arrow)"/><path d="M490 215A85 85 0 0 1 550.1 239.9" fill="none" stroke="#bc8c4d" stroke-width="2.5"/><text x="527" y="200" fill="#bc8c4d" font-size="25" text-anchor="middle">φ</text><text x="490" y="65" fill="#305b54" font-size="22" text-anchor="middle">竖直向上 z</text><text x="670" y="175" fill="#305b54" font-size="21" text-anchor="middle">管轴</text><text x="380" y="375" fill="#305b54" font-size="23" text-anchor="middle">θ 比较相邻两段；φ 以竖直方向为基准</text></g></svg>