<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title"><title id="title">内径水力直径和壁厚</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="420" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><circle cx="210" cy="190" r="100" fill="#bc8c4d" stroke="#305b54"/><circle cx="210" cy="190" r="80" fill="#dcecea" stroke="#305b54"/><path d="M130.00 190.00L290.00 190.00" fill="none" stroke="#305b54" stroke-width="1.5" marker-end="url(#arrow)"/><text x="210" y="175" fill="#305b54" font-size="26" text-anchor="middle">D</text><text x="210" y="65" fill="#305b54" font-size="25" text-anchor="middle">圆管</text><path d="M280.00 120.00L340.00 90.00" fill="none" stroke="#305b54" stroke-width="1.5"/><text x="350" y="85" fill="#305b54" font-size="20" text-anchor="start">壁厚 δ</text><text x="210" y="325" fill="#305b54" font-size="23" text-anchor="middle">A = πD²/4；Dh = D</text><rect x="450" y="130" width="230" height="130" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><path d="M450.00 280.00L680.00 280.00" fill="none" stroke="#305b54" stroke-width="1.5"/><path d="M450.00 270.00L450.00 290.00" fill="none" stroke="#305b54" stroke-width="1.5"/><path d="M680.00 270.00L680.00 290.00" fill="none" stroke="#305b54" stroke-width="1.5"/><text x="565" y="307" fill="#305b54" font-size="24" text-anchor="middle">a</text><path d="M710.00 130.00L710.00 260.00" fill="none" stroke="#305b54" stroke-width="1.5"/><path d="M700.00 130.00L720.00 130.00" fill="none" stroke="#305b54" stroke-width="1.5"/><path d="M700.00 260.00L720.00 260.00" fill="none" stroke="#305b54" stroke-width="1.5"/><text x="730" y="200" fill="#305b54" font-size="24" text-anchor="middle">b</text><text x="560" y="65" fill="#305b54" font-size="25" text-anchor="middle">矩形通道</text><text x="560" y="350" fill="#305b54" font-size="22" text-anchor="middle">A = ab；Pw = 2(a + b)</text><text x="380" y="395" fill="#305b54" font-size="25" text-anchor="middle">水力直径 Dh = 4A / Pw</text></g></svg>