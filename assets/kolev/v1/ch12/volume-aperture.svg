<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">体积储存率和面开放率的独立含义</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="95" y="85" width="230" height="220" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="95" y="85" width="80" height="220" fill="#bc8c4d" stroke="#305b54" stroke-width="1.3"/><text x="245" y="200" fill="#305b54" font-size="23" text-anchor="middle">可用体积</text><rect x="485" y="85" width="95" height="220" fill="#bc8c4d" stroke="#305b54" stroke-width="1.3"/><rect x="485" y="155" width="95" height="80" fill="#f5f7f1" stroke="#305b54" stroke-width="1.3"/><path d="M395.00 195.00L665.00 195.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="210" y="55" fill="#305b54" font-size="24" text-anchor="middle">单元内部</text><text x="535" y="55" fill="#305b54" font-size="24" text-anchor="middle">穿过单元面</text><text x="210" y="355" fill="#305b54" font-size="21" text-anchor="middle">γᵥ = 可用体积 / 总体积</text><text x="535" y="355" fill="#305b54" font-size="21" text-anchor="middle">γf = 开放面积 / 总面积</text></g></svg>