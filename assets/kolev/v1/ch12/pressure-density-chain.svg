<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">邻居压力的速度与密度链式导数</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="130" y="205" fill="#305b54" font-size="25" text-anchor="middle">邻居压力 pm</text><path d="M230.00 185.00L360.00 105.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M230.00 220.00L360.00 290.00" fill="none" stroke="#bc8c4d" stroke-width="2.5" marker-end="url(#arrow)"/><text x="440" y="95" fill="#298999" font-size="25" text-anchor="middle">面法向速度 Vn</text><text x="440" y="132" fill="#298999" font-size="22" text-anchor="middle">∂Vn / ∂pm = −R</text><text x="440" y="280" fill="#bc8c4d" font-size="25" text-anchor="middle">邻居密度 ρm</text><text x="440" y="317" fill="#bc8c4d" font-size="22" text-anchor="middle">∂ρm / ∂pm</text><path d="M545.00 115.00L645.00 180.00" fill="none" stroke="#298999" stroke-width="2" marker-end="url(#arrow)"/><path d="M545.00 285.00L645.00 225.00" fill="none" stroke="#bc8c4d" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="205" fill="#305b54" font-size="30" text-anchor="middle">B⁻</text><text x="380" y="380" fill="#305b54" font-size="24" text-anchor="middle">流入质量率同时依赖速度和密度</text></g></svg>