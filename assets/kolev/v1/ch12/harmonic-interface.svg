<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">连续通量与两侧不同扩散梯度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="100" y="90" width="260" height="220" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><rect x="360" y="90" width="260" height="220" fill="#e9dac2" stroke="#305b54" stroke-width="1.3"/><text x="230" y="65" fill="#305b54" font-size="24" text-anchor="middle">D₁ = 4 D₂</text><text x="490" y="65" fill="#305b54" font-size="24" text-anchor="middle">D₂</text><path d="M100.00 120.00L360.00 158.00" fill="none" stroke="#298999" stroke-width="3"/><path d="M360.00 158.00L620.00 310.00" fill="none" stroke="#298999" stroke-width="3"/><text x="80" y="125" fill="#305b54" font-size="22" text-anchor="end">C₁</text><text x="640" y="315" fill="#305b54" font-size="22" text-anchor="start">C₂</text><text x="375" y="145" fill="#305b54" font-size="22" text-anchor="start">Cf</text><path d="M230.00 250.00L490.00 250.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="360" y="280" fill="#305b54" font-size="21" text-anchor="middle">同一扩散通量</text><text x="380" y="370" fill="#305b54" font-size="23" text-anchor="middle">d₁ / D₁ + d₂ / D₂：串联扩散阻力</text></g></svg>