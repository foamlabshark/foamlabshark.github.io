<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">一个时间步内的耦合迭代和失败退回</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="40" y="40" width="220" height="65" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="150.0" y="81" fill="#305b54" font-size="23" text-anchor="middle">保存已接受旧层</text><rect x="310" y="40" width="370" height="65" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="495.0" y="81" fill="#305b54" font-size="23" text-anchor="middle">更新物性、热质与面通量</text><rect x="310" y="155" width="370" height="65" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="495.0" y="196" fill="#305b54" font-size="23" text-anchor="middle">求压力并回代各场变量</text><rect x="310" y="275" width="370" height="65" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="495.0" y="316" fill="#305b54" font-size="23" text-anchor="middle">完整收支与定义域检查</text><path d="M265.00 72.00L300.00 72.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M495.00 110.00L495.00 145.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M495.00 225.00L495.00 265.00" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M690 305H725V72H690" fill="none" stroke="#298999" stroke-width="2.5" marker-end="url(#arrow)"/><text x="707" y="370" fill="#305b54" font-size="19" text-anchor="end">继续迭代</text><path d="M300 305H150V115" fill="none" stroke="#b35d4b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="142" y="237" fill="#b35d4b" font-size="22" text-anchor="end">失败退回</text><text x="142" y="265" fill="#b35d4b" font-size="20" text-anchor="end">减小步长</text><path d="M495