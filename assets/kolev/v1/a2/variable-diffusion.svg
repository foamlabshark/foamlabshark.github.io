<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">不同系数下连续的稳态扩散通量</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><polygon points="95.00,300.00 380.00,300.00 380.00,75.00 95.00,75.00" fill="#dcecea" stroke="#305b54" stroke-width="1.5"/><polygon points="380.00,300.00 665.00,300.00 665.00,75.00 380.00,75.00" fill="#e9dac2" stroke="#305b54" stroke-width="1.5"/><path d="M110.00 115.00L380.00 220.00L650.00 255.00" fill="none" stroke="#298999" stroke-width="3"/><path d="M250.00 190.00L500.00 190.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="230.00" y="340.00" fill="#305b54" font-size="24" text-anchor="middle">λ₁ 小：梯度大</text><text x="525.00" y="340.00" fill="#305b54" font-size="24" text-anchor="middle">λ₂ 大：梯度小</text><text x="380.00" y="50.00" fill="#305b54" font-size="27" text-anchor="middle">−λ₁ φ′₁ = −λ₂ φ′₂</text><text x="535.00" y="145.00" fill="#bc8c4d" font-size="24" text-anchor="middle">相同通量</text></g></svg>