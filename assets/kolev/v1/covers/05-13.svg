<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">温度与组分耦合</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="350" y="90" fill="#305b54" font-size="26" text-anchor="middle">dh = cp dT + hp dp + Σhᵢ dCᵢ</text><path d="M170.00 140.00L170.00 225.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="170" y="268" fill="#305b54" font-size="24" text-anchor="middle">温度 T</text><path d="M350.00 140.00L350.00 225.00" fill="none" stroke="#bc8c4d" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="268" fill="#305b54" font-size="24" text-anchor="middle">压力 p</text><path d="M530.00 140.00L530.00 225.00" fill="none" stroke="#305b54" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="268" fill="#305b54" font-size="24" text-anchor="middle">组成 Cᵢ</text></g></svg>