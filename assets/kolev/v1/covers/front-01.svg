<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title"><title id="title">多相流符号表封面</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="380" y="65" font-size="26" fill="#305b54" text-anchor="middle">体积、界面与平均量</text><rect x="120" y="105" width="250" height="180" fill="#dcecea" stroke="#305b54" stroke-width="2"/><circle cx="170" cy="155" r="17" fill="#f5f7f1" stroke="#298999" stroke-width="2"/><circle cx="270" cy="200" r="28" fill="#f5f7f1" stroke="#298999" stroke-width="2"/><circle cx="315" cy="145" r="13" fill="#f5f7f1" stroke="#298999" stroke-width="2"/><circle cx="190" cy="245" r="15" fill="#f5f7f1" stroke="#298999" stroke-width="2"/><text x="245" y="325" font-size="23" fill="#305b54" text-anchor="middle">V = V₁ + V₂</text><text x="555" y="150" font-size="28" fill="#305b54" text-anchor="middle">α₁ + α₂ = 1</text><text x="555" y="212" font-size="25" fill="#305b54" text-anchor="middle">ρ̅ = α₁ρ₁ + α₂ρ₂</text><text x="555" y="274" font-size="26" fill="#305b54" text-anchor="middle">aσ = Aσ / V</text></g></svg>