<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">热状态的变量转换</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="380" y="53" fill="#305b54" font-size="25" text-anchor="middle">热状态的变量转换</text><path d="M160.00 265.00L635.00 265.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M160.00 265.00L160.00 90.00" fill="none" stroke="#305b54" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M185.00 235.00L575.00 135.00" fill="none" stroke="#298999" stroke-width="2.5" stroke-linejoin="round"/><path d="M185.00 195.00L575.00 95.00" fill="none" stroke="#bc8c4d" stroke-width="2.5" stroke-linejoin="round"/><text x="145" y="85" fill="#305b54" font-size="24" text-anchor="middle">h</text><text x="650" y="272" fill="#305b54" font-size="24" text-anchor="middle">T</text><text x="605" y="140" fill="#298999" font-size="22" text-anchor="middle">p₁</text><text x="605" y="100" fill="#bc8c4d" font-size="22" text-anchor="middle">p₂</text><text x="360" y="290" fill="#305b54" font-size="19" text-anchor="middle">定组成液体：h ≈ cp T + v (p − p₀)</text><text x="380" y="355" fill="#305b54" font-size="22" text-anchor="middle">h = h(p, T, C₁, …, Cₙ)</text></g></svg>