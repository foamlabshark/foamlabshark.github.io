<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title"><title id="title">熵通量与产生</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="700" height="350" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><rect x="220" y="85" width="260" height="170" fill="#dcecea" stroke="#305b54" stroke-width="1.3"/><text x="350" y="155" fill="#305b54" font-size="29" text-anchor="middle">ρs</text><text x="350" y="210" fill="#305b54" font-size="27" text-anchor="middle">σs ≥ 0</text><path d="M85.00 168.00L210.00 168.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><path d="M490.00 168.00L615.00 168.00" fill="none" stroke="#298999" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="310" fill="#305b54" font-size="20" text-anchor="middle">熵储存 + 熵流出 = 熵供给 + 熵产生</text></g></svg>