<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title"><title id="title">温度与组分焓输运</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="760" height="400" rx="10" fill="#f5f7f1"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="380" y="53" fill="#305b54" font-size="25" text-anchor="middle">温度与组分焓输运</text><path d="M180.00 125.00L580.00 125.00" fill="none" stroke="#298999" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="102" fill="#298999" font-size="23" text-anchor="middle">组分 1：j₁ ĥ₁</text><path d="M580.00 215.00L180.00 215.00" fill="none" stroke="#bc8c4d" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="253" fill="#bc8c4d" font-size="23" text-anchor="middle">组分 2：j₂ ĥ₂</text><text x="380" y="180" fill="#305b54" font-size="25" text-anchor="middle">j₁ + j₂ = 0</text><text x="380" y="355" fill="#305b54" font-size="22" text-anchor="middle">cp L T − (1 − ρhp) L p / ρ</text></g></svg>