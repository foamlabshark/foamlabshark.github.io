<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">库朗数：时间步内的对流位移</title><desc id="desc">速度 U = 1 m/s；网格宽度 Δx = 1 mm</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
<radialGradient id="heat"><stop stop-color="#d58b61"/><stop offset="1" stop-color="#a2c8c4"/></radialGradient></defs>
<rect width="800" height="600" rx="18" fill="#faf9f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="35" y="53" font-size="32" fill="#25473f" text-anchor="start" font-weight="bold">库朗数：时间步内的对流位移</text><text x="35" y="94" font-size="23" fill="#5f756d" text-anchor="start" font-weight="normal">速度 U = 1 m/s；网格宽度 Δx = 1 mm</text>
<text x="45" y="154" font-size="29" fill="#25473f" text-anchor="start" font-weight="bold">Co = 0.2；Δt = 0.2 ms</text><rect x="80" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="160" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="240" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="320" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="400" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="480" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="560" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="640" y="202" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><circle cx="120" cy="234" r="6" fill="#9aaba4" stroke="none" stroke-width="3"/><circle cx="136" cy="234" r="6" fill="#ad6847" stroke="none" stroke-width="3"/><path d="M120 183L136 183" fill="none" stroke="#ad6847" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="306" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">一步移动 0.2 mm，即 0.2 个单元。</text><text x="45" y="364" font-size="29" fill="#25473f" text-anchor="start" font-weight="bold">Co = 2；Δt = 2 ms</text><rect x="80" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="160" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="240" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="320" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="400" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="480" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="560" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><rect x="640" y="412" width="80" height="65" fill="#edf3e8" stroke="#8ca799" stroke-width="2"/><circle cx="120" cy="444" r="6" fill="#9aaba4" stroke="none" stroke-width="3"/><circle cx="280" cy="444" r="6" fill="#ad6847" stroke="none" stroke-width="3"/><path d="M120 393L280 393" fill="none" stroke="#ad6847" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="516" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">一步移动 2 mm，即 2 个单元。</text><text x="35" y="567" font-size="24" fill="#5f756d" text-anchor="start" font-weight="normal">灰点：起始位置　彩色点：一步后的位置</text>
</g></svg>