<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">界面变形：惯性、黏性与重力</title><desc id="desc">分别改变速度、黏度或尺寸，比较各项作用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
<radialGradient id="heat"><stop stop-color="#d58b61"/><stop offset="1" stop-color="#a2c8c4"/></radialGradient></defs>
<rect width="800" height="680" rx="18" fill="#faf9f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="35" y="53" font-size="32" fill="#25473f" text-anchor="start" font-weight="bold">界面变形：惯性、黏性与重力</text><text x="35" y="94" font-size="23" fill="#5f756d" text-anchor="start" font-weight="normal">分别改变速度、黏度或尺寸，比较各项作用。</text>
<rect x="35" y="135" width="224" height="260" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="147" y="179" font-size="27" fill="#25473f" text-anchor="middle" font-weight="bold">We：惯性</text><circle cx="147" cy="263" r="43" fill="#c7dfd9" stroke="#639b8d" stroke-width="3"/><text x="147" y="369" font-size="24" fill="#397f70" text-anchor="middle" font-weight="normal">比较惯性压力</text><rect x="288" y="135" width="224" height="260" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="400" y="179" font-size="27" fill="#25473f" text-anchor="middle" font-weight="bold">Ca：黏性</text><circle cx="400" cy="263" r="43" fill="#c7dfd9" stroke="#639b8d" stroke-width="3"/><text x="400" y="369" font-size="24" fill="#397f70" text-anchor="middle" font-weight="normal">比较黏性剪切</text><rect x="541" y="135" width="224" height="260" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="653" y="179" font-size="27" fill="#25473f" text-anchor="middle" font-weight="bold">Bo：重力</text><circle cx="653" cy="263" r="43" fill="#c7dfd9" stroke="#639b8d" stroke-width="3"/><text x="653" y="369" font-size="24" fill="#397f70" text-anchor="middle" font-weight="normal">比较重力压差</text><path d="M49 251L91 251" fill="none" stroke="#ad6847" stroke-width="4" marker-end="url(#arrow)"/><path d="M49 275L91 275" fill="none" stroke="#ad6847" stroke-width="4" marker-end="url(#arrow)"/><path d="M331 205L469 205" fill="none" stroke="#ad6847" stroke-width="4" marker-end="url(#arrow)"/><path d="M469 321L331 321" fill="none" stroke="#ad6847" stroke-width="4" marker-end="url(#arrow)"/><path d="M718 222L718 304" fill="none" stroke="#ad6847" stroke-width="4" marker-end="url(#arrow)"/><text x="735" y="270" font-size="24" fill="#ad6847" text-anchor="start" font-weight="normal">g</text><text x="400" y="434" font-size="25" fill="#5f756d" text-anchor="middle" font-weight="normal">表面张力提供恢复作用；Oh 衡量黏性阻尼。</text><rect x="35" y="463" width="730" height="182" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="57" y="506" font-size="25" fill="#25473f" text-anchor="start" font-weight="normal">速度 ×10 → We ×100，Ca ×10，Bo 不变</text><text x="57" y="553" font-size="25" fill="#25473f" text-anchor="start" font-weight="normal">黏度 ×10 → Ca、Oh ×10，We、Bo 不变</text><text x="57" y="600" font-size="25" fill="#25473f" text-anchor="start" font-weight="normal">尺寸 ×10 → We ×10，Bo ×100，Ca 不变</text>
</g></svg>