<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">毕渥数：固体冷却过程的内部温差</title><desc id="desc">相同换热系数 h = 100 W/(m²·K)，Lc = 5 mm</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
<radialGradient id="heat"><stop stop-color="#d58b61"/><stop offset="1" stop-color="#a2c8c4"/></radialGradient></defs>
<rect width="800" height="680" rx="18" fill="#faf9f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="35" y="53" font-size="32" fill="#25473f" text-anchor="start" font-weight="bold">毕渥数：固体冷却过程的内部温差</text><text x="35" y="94" font-size="23" fill="#5f756d" text-anchor="start" font-weight="normal">相同换热系数 h = 100 W/(m²·K)，Lc = 5 mm</text>
<rect x="35" y="135" width="350" height="335" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="210" y="178" font-size="30" fill="#25473f" text-anchor="middle" font-weight="bold">Bi = 0.0025</text><text x="210" y="216" font-size="24" fill="#5f756d" text-anchor="middle" font-weight="normal">kₛ = 200 W/(m·K)</text><circle cx="210" cy="300" r="61" fill="#d4a783" stroke="#8ba69b" stroke-width="3"/><path d="M141 300L104 300" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><path d="M279 300L317 300" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><path d="M210 370L210 393" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><text x="210" y="430" font-size="25" fill="#397f70" text-anchor="middle" font-weight="normal">内部导热阻力小</text><text x="210" y="458" font-size="23" fill="#5f756d" text-anchor="middle" font-weight="normal">中心与表面温度较接近</text><rect x="415" y="135" width="350" height="335" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="590" y="178" font-size="30" fill="#25473f" text-anchor="middle" font-weight="bold">Bi = 2.5</text><text x="590" y="216" font-size="24" fill="#5f756d" text-anchor="middle" font-weight="normal">kₛ = 0.2 W/(m·K)</text><circle cx="590" cy="300" r="61" fill="url(#heat)" stroke="#8ba69b" stroke-width="3"/><path d="M521 300L484 300" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><path d="M659 300L697 300" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 370L590 393" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><text x="590" y="430" font-size="25" fill="#397f70" text-anchor="middle" font-weight="normal">内部导热阻力大</text><text x="590" y="458" font-size="23" fill="#5f756d" text-anchor="middle" font-weight="normal">中心仍热，表面已降温</text><rect x="35" y="500" width="730" height="140" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="57" y="542" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">Fo = 0.004：扩散尺度约 0.316 mm</text><text x="57" y="586" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">Fo = 4：扩散尺度约 10 mm</text><text x="57" y="623" font-size="23" fill="#5f756d" text-anchor="start" font-weight="normal">这里取热扩散率 10⁻⁵ m²/s，长度 5 mm。</text>
</g></svg>