<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">佩克莱数：被带走，还是先扩散</title><desc id="desc">中心随流体移动；扩散使分布向周围展开。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
<radialGradient id="heat"><stop stop-color="#d58b61"/><stop offset="1" stop-color="#a2c8c4"/></radialGradient></defs>
<rect width="800" height="680" rx="18" fill="#faf9f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="35" y="53" font-size="32" fill="#25473f" text-anchor="start" font-weight="bold">佩克莱数：被带走，还是先扩散</text><text x="35" y="94" font-size="23" fill="#5f756d" text-anchor="start" font-weight="normal">中心随流体移动；扩散使分布向周围展开。</text>
<rect x="30" y="130" width="740" height="226" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="55" y="168" font-size="30" fill="#25473f" text-anchor="start" font-weight="bold">Pe = 0.1</text><text x="740" y="168" font-size="26" fill="#397f70" text-anchor="end" font-weight="normal">扩散尺度 约 3.16L</text><rect x="183.64" y="235" width="442.72" height="58" rx="7" fill="#d8e7e1" stroke="#64998c" stroke-width="2"/><path d="M335 209L405 209" fill="none" stroke="#ad6847" stroke-width="3" marker-end="url(#arrow)"/><path d="M335 227L335 325" fill="none" stroke="#5f756d" stroke-width="2" stroke-dasharray="7 6"/><circle cx="405" cy="264" r="5" fill="#397f70" stroke="none" stroke-width="3"/><text x="350" y="200" font-size="24" fill="#ad6847" text-anchor="start" font-weight="normal">L</text><text x="320" y="345" font-size="23" fill="#5f756d" text-anchor="end" font-weight="normal">起点</text><text x="420" y="345" font-size="23" fill="#397f70" text-anchor="start" font-weight="normal">移动后中心</text><rect x="30" y="388" width="740" height="226" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="55" y="426" font-size="30" fill="#25473f" text-anchor="start" font-weight="bold">Pe = 100</text><text x="740" y="426" font-size="26" fill="#397f70" text-anchor="end" font-weight="normal">扩散尺度 约 0.1L</text><rect x="398.00" y="493" width="14.00" height="58" rx="7" fill="#84bdb2" stroke="#64998c" stroke-width="2"/><path d="M335 467L405 467" fill="none" stroke="#ad6847" stroke-width="3" marker-end="url(#arrow)"/><path d="M335 485L335 583" fill="none" stroke="#5f756d" stroke-width="2" stroke-dasharray="7 6"/><circle cx="405" cy="522" r="5" fill="#397f70" stroke="none" stroke-width="3"/><text x="350" y="458" font-size="24" fill="#ad6847" text-anchor="start" font-weight="normal">L</text><text x="320" y="603" font-size="23" fill="#5f756d" text-anchor="end" font-weight="normal">起点</text><text x="420" y="603" font-size="23" fill="#397f70" text-anchor="start" font-weight="normal">移动后中心</text><text x="35" y="655" font-size="24" fill="#5f756d" text-anchor="start" font-weight="normal">观察时间均为 L/U；扩散尺度取 √(Γt)。</text>
</g></svg>