<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">雷诺数：比较两种时间</title><desc id="desc">两种工况均取水的运动黏度  ν = 10⁻⁶ m²/s</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
<radialGradient id="heat"><stop stop-color="#d58b61"/><stop offset="1" stop-color="#a2c8c4"/></radialGradient></defs>
<rect width="800" height="680" rx="18" fill="#faf9f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="35" y="53" font-size="32" fill="#25473f" text-anchor="start" font-weight="bold">雷诺数：比较两种时间</text><text x="35" y="94" font-size="23" fill="#5f756d" text-anchor="start" font-weight="normal">两种工况均取水的运动黏度  ν = 10⁻⁶ m²/s</text>
<rect x="30" y="130" width="740" height="225" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="55" y="170" font-size="29" fill="#25473f" text-anchor="start" font-weight="bold">微通道：Re = 0.1</text><text x="55" y="209" font-size="24" fill="#5f756d" text-anchor="start" font-weight="normal">L = 0.1 mm；U = 1 mm/s</text><path d="M65 240L325 240" fill="none" stroke="#5f756d" stroke-width="3"/><path d="M65 315L325 315" fill="none" stroke="#5f756d" stroke-width="3"/><path d="M85 277L310 277" fill="none" stroke="#397f70" stroke-width="4" marker-end="url(#arrow)"/><path d="M185 275L185 247" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 280L230 308" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><text x="355" y="254" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">通过时间 0.1 s</text><text x="355" y="296" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">黏性扩散时间 0.01 s</text><text x="55" y="341" font-size="24" fill="#397f70" text-anchor="start" font-weight="normal">黏性调整比流体通过更快</text><rect x="30" y="386" width="740" height="225" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="55" y="426" font-size="29" fill="#25473f" text-anchor="start" font-weight="bold">管道水流：Re = 10 000</text><text x="55" y="465" font-size="24" fill="#5f756d" text-anchor="start" font-weight="normal">L = 20 mm；U = 0.5 m/s</text><path d="M65 496L325 496" fill="none" stroke="#5f756d" stroke-width="3"/><path d="M65 571L325 571" fill="none" stroke="#5f756d" stroke-width="3"/><path d="M85 533L310 533" fill="none" stroke="#397f70" stroke-width="4" marker-end="url(#arrow)"/><path d="M185 531L185 520" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><path d="M230 536L230 547" fill="none" stroke="#4b8498" stroke-width="3" marker-end="url(#arrow)"/><text x="355" y="510" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">通过时间 0.04 s</text><text x="355" y="552" font-size="26" fill="#25473f" text-anchor="start" font-weight="normal">黏性扩散时间 400 s</text><text x="55" y="597" font-size="24" fill="#397f70" text-anchor="start" font-weight="normal">流体通过较快，整体黏性调整较慢</text><text x="35" y="654" font-size="24" fill="#5f756d" text-anchor="start" font-weight="normal">绿色：向前运动　蓝色：速度扰动的黏性扩散</text>
</g></svg>