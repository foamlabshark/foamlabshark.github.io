<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">弗劳德数：浅水长波的传播方向</title><desc id="desc">矩形明渠水深 H = 0.1 m；长波波速 c ≈ 0.990 m/s</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker>
<radialGradient id="heat"><stop stop-color="#d58b61"/><stop offset="1" stop-color="#a2c8c4"/></radialGradient></defs>
<rect width="800" height="680" rx="18" fill="#faf9f1"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="35" y="53" font-size="32" fill="#25473f" text-anchor="start" font-weight="bold">弗劳德数：浅水长波的传播方向</text><text x="35" y="94" font-size="23" fill="#5f756d" text-anchor="start" font-weight="normal">矩形明渠水深 H = 0.1 m；长波波速 c ≈ 0.990 m/s</text>
<rect x="30" y="130" width="740" height="228" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="55" y="169" font-size="29" fill="#25473f" text-anchor="start" font-weight="bold">U = 0.2 m/s；Fr = 0.202</text><text x="55" y="206" font-size="25" fill="#397f70" text-anchor="start" font-weight="normal">缓流：扰动可以逆流传播</text><path d="M60 264H368Q380 238 392 264H740V325H60Z" fill="#c9e0da"/><path d="M80 310L240 310" fill="none" stroke="#397f70" stroke-width="4" marker-end="url(#arrow)"/><path d="M380 242L155 242" fill="none" stroke="#4b8498" stroke-width="4" marker-end="url(#arrow)"/><path d="M405 291L700 291" fill="none" stroke="#ad6847" stroke-width="4" marker-end="url(#arrow)"/><text x="140" y="232" font-size="23" fill="#4b8498" text-anchor="start" font-weight="normal">U − c = −0.790</text><text x="436" y="337" font-size="23" fill="#ad6847" text-anchor="start" font-weight="normal">U + c = 1.190</text><rect x="30" y="388" width="740" height="228" rx="14" fill="#eef3e9" stroke="#d2ded4"/><text x="55" y="427" font-size="29" fill="#25473f" text-anchor="start" font-weight="bold">U = 2.0 m/s；Fr = 2.02</text><text x="55" y="464" font-size="25" fill="#397f70" text-anchor="start" font-weight="normal">急流：两支扰动都向下游</text><path d="M60 522H368Q380 496 392 522H740V583H60Z" fill="#c9e0da"/><path d="M80 568L240 568" fill="none" stroke="#397f70" stroke-width="4" marker-end="url(#arrow)"/><path d="M380 500L535 500" fill="none" stroke="#4b8498" stroke-width="4" marker-end="url(#arrow)"/><path d="M405 549L700 549" fill="none" stroke="#ad6847" stroke-width="4" marker-end="url(#arrow)"/><text x="438" y="490" font-size="23" fill="#4b8498" text-anchor="start" font-weight="normal">U − c = 1.010</text><text x="436" y="595" font-size="23" fill="#ad6847" text-anchor="start" font-weight="normal">U + c = 2.990</text><text x="35" y="655" font-size="24" fill="#5f756d" text-anchor="start" font-weight="normal">箭头速度的单位为 m/s，均相对于岸边。</text>
</g></svg>