<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="445" viewBox="0 0 1120 445" role="img"><title>用三组数据观察计算过程</title><rect width="1120" height="445" fill="#f4f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="38" y="55" font-size="28" font-weight="bold" fill="#243d35">用三组数据观察计算过程</text><text x="38" y="92" font-size="18" fill="#527066">按研究问题选择监测量</text><rect x="38" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="38" y="140" width="314" height="49" rx="12" fill="#2e7462"/><text x="58" y="173" fill="white" font-size="21" font-weight="bold">代数求解</text><text x="58" y="223" font-size="18" fill="#29443d">solverInfo</text><text x="58" y="260" font-size="18" fill="#29443d">初始 / 最终残差</text><text x="58" y="297" font-size="18" fill="#29443d">线性迭代次数</text><path d="M 360,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="393" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="393" y="140" width="314" height="49" rx="12" fill="#327db0"/><text x="413" y="173" fill="white" font-size="21" font-weight="bold">离散与守恒</text><text x="413" y="223" font-size="18" fill="#29443d">continuityError</text><text x="413" y="260" font-size="18" fill="#29443d">局部 / 全局 / 累计误差</text><text x="413" y="297" font-size="18" fill="#29443d">Co 场定位时间步限制</text><path d="M 715,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="748" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="748" y="140" width="314" height="49" rx="12" fill="#aa7830"/><text x="768" y="173" fill="white" font-size="21" font-weight="bold">物理结果</text><text x="768" y="223" font-size="18" fill="#29443d">流量与压降</text><text x="768" y="260" font-size="18" fill="#29443d">力、热功率或水相体积</text><text x="768" y="297" font-size="18" fill="#29443d">随时间 / 迭代的变化</text><text x="38" y="407" font-size="17" fill="#527066">把残差、守恒与目标物理量一起查看，判断继续迭代、延长统计或调整网格。</text></g></svg>