<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="445" viewBox="0 0 1120 445" role="img"><title>从计算场到后处理结果</title><rect width="1120" height="445" fill="#f4f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="38" y="55" font-size="28" font-weight="bold" fill="#243d35">从计算场到后处理结果</text><text x="38" y="92" font-size="18" fill="#527066">functionObject 的输入、处理与输出</text><rect x="38" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="38" y="140" width="314" height="49" rx="12" fill="#2e7462"/><text x="58" y="173" fill="white" font-size="21" font-weight="bold">读取输入</text><text x="58" y="223" font-size="18" fill="#29443d">求解器内存中的 U、p、T</text><text x="58" y="260" font-size="18" fill="#29443d">或时间目录中的已有场</text><text x="58" y="297" font-size="18" fill="#29443d">readFields → 对象数据库</text><path d="M 360,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="393" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="393" y="140" width="314" height="49" rx="12" fill="#327db0"/><text x="413" y="173" fill="white" font-size="21" font-weight="bold">选择处理</text><text x="413" y="223" font-size="18" fill="#29443d">点 / 线 / 面：采样</text><text x="413" y="260" font-size="18" fill="#29443d">场运算 / 平均 / 积分</text><text x="413" y="297" font-size="18" fill="#29443d">执行频率与输出频率分开</text><path d="M 715,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="748" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="748" y="140" width="314" height="49" rx="12" fill="#aa7830"/><text x="768" y="173" fill="white" font-size="21" font-weight="bold">保存结果</text><text x="768" y="223" font-size="18" fill="#29443d">OpenFOAM 派生场</text><text x="768" y="260" font-size="18" fill="#29443d">postProcessing 文本曲线</text><text x="768" y="297" font-size="18" fill="#29443d">VTK / EnSight 几何与数据</text><text x="38" y="407" font-size="17" fill="#527066">配置位置：system/controlDict → functions；独立配置可由 postProcess -dict 调用。</text></g></svg>