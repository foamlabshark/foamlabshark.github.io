<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="445" viewBox="0 0 1120 445" role="img"><title>执行与写出是两个时序</title><rect width="1120" height="445" fill="#f4f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="38" y="55" font-size="28" font-weight="bold" fill="#243d35">执行与写出是两个时序</text><text x="38" y="92" font-size="18" fill="#527066">方腔：Δt = 0.005 s；fieldAverage 从 0.1 s 开始</text><rect x="38" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="38" y="140" width="314" height="49" rx="12" fill="#2e7462"/><text x="58" y="173" fill="white" font-size="21" font-weight="bold">求解时间步</text><text x="58" y="223" font-size="18" fill="#29443d">0.005、0.010、0.015 …</text><text x="58" y="260" font-size="18" fill="#29443d">更新速度与压力</text><text x="58" y="297" font-size="18" fill="#29443d">一直推进到 0.5 s</text><path d="M 360,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="393" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="393" y="140" width="314" height="49" rx="12" fill="#327db0"/><text x="413" y="173" fill="white" font-size="21" font-weight="bold">平均场更新</text><text x="413" y="223" font-size="18" fill="#29443d">timeStart 0.1</text><text x="413" y="260" font-size="18" fill="#29443d">executeControl timeStep</text><text x="413" y="297" font-size="18" fill="#29443d">executeInterval 1</text><path d="M 715,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="748" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="748" y="140" width="314" height="49" rx="12" fill="#aa7830"/><text x="768" y="173" fill="white" font-size="21" font-weight="bold">保存统计结果</text><text x="768" y="223" font-size="18" fill="#29443d">writeControl writeTime</text><text x="768" y="260" font-size="18" fill="#29443d">随主场每 0.05 s 保存</text><text x="768" y="297" font-size="18" fill="#29443d">UMean / UPrime2Mean</text><text x="38" y="407" font-size="17" fill="#527066">自动停止示例：控制器在 0.005 s 首次执行，累计 0.2 s 后于 0.205 s 结束。</text></g></svg>