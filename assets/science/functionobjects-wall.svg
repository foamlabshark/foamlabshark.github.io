<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="445" viewBox="0 0 1120 445" role="img"><title>把近壁网格与模型结果联系起来</title><rect width="1120" height="445" fill="#f4f8f5"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="38" y="55" font-size="28" font-weight="bold" fill="#243d35">把近壁网格与模型结果联系起来</text><text x="38" y="92" font-size="18" fill="#527066">壁面后处理使用求解器提供的动量和湍流模型</text><rect x="38" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="38" y="140" width="314" height="49" rx="12" fill="#2e7462"/><text x="58" y="173" fill="white" font-size="21" font-weight="bold">网格位置：yPlus</text><text x="58" y="223" font-size="18" fill="#29443d">首层单元距壁距离 y</text><text x="58" y="260" font-size="18" fill="#29443d">摩擦速度与运动黏度</text><text x="58" y="297" font-size="18" fill="#29443d">得到壁面单位 y+</text><path d="M 360,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="393" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="393" y="140" width="314" height="49" rx="12" fill="#327db0"/><text x="413" y="173" fill="white" font-size="21" font-weight="bold">摩擦：wallShearStress</text><text x="413" y="223" font-size="18" fill="#29443d">壁面应力向量</text><text x="413" y="260" font-size="18" fill="#29443d">大小：局部摩擦强弱</text><text x="413" y="297" font-size="18" fill="#29443d">方向：分离与再附着</text><path d="M 715,246 h 25 m -7,-6 7,6 -7,6" fill="none" stroke="#488776" stroke-width="2"/><rect x="748" y="140" width="314" height="216" rx="12" fill="white" stroke="#cbded5"/><rect x="748" y="140" width="314" height="49" rx="12" fill="#aa7830"/><text x="768" y="173" fill="white" font-size="21" font-weight="bold">模型：turbulenceFields</text><text x="768" y="223" font-size="18" fill="#29443d">k / epsilon / omega</text><text x="768" y="260" font-size="18" fill="#29443d">nut / R / 有效应力</text><text x="768" y="297" font-size="18" fill="#29443d">对照湍流强度与输运</text><text x="38" y="407" font-size="17" fill="#527066">先运行模型，再输出壁面量；离线处理可使用 simpleFoam -postProcess。</text></g></svg>