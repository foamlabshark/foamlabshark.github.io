<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>流光画布 · 熊猫游乐园</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <canvas aria-label="流体画布，拖动鼠标或手指，让颜色随涡旋流动" tabindex="0"></canvas>
  <div class="fluid-help">拖动鼠标或手指，画出彩色涡旋</div>
  <nav class="fluid-tools" aria-label="游戏操作">
    <button type="button" data-fluid="splash">添一抹颜色</button>
    <button type="button" data-fluid="pause" aria-pressed="false">暂停</button>
    <button type="button" data-fluid="settings" aria-controls="fluid-settings" aria-expanded="true">收起设置</button>
    <span>空格 · 添色　P · 暂停</span>
  </nav>
  <aside id="fluid-settings" class="fluid-settings" aria-label="流光画布设置">
    <header><strong>画布设置</strong><button type="button" data-fluid="hide-settings" aria-label="收起画布设置">−</button></header>
    <div data-fluid-options></div>
    <button type="button" data-fluid="random">随机泼洒</button>
    <details><summary>辉光</summary><div data-fluid-bloom></div></details>
    <details><summary>光束</summary><div data-fluid-sunrays></div></details>
    <details><summary>截图</summary><div data-fluid-capture></div><button type="button" data-fluid="capture">保存截图</button><p data-capture-status role="status"></p></details>
  </aside>
  <section class="fluid-error" hidden role="alert">
    <strong>这台设备暂时无法打开流体画布</strong>
    <p>请启用浏览器的图形加速，或换一个支持 WebGL 的浏览器。</p>
    <button type="button" data-fluid="close">返回游乐园</button>
  </section>
  <script src="simulation.js"></script>
  <script src="shell.js"></script>
</body>
</html>
