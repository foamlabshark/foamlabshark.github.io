<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">气泡柱：入口注气、柱内滑移和顶部排出</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">气泡柱：入口注气、柱内滑移和顶部排出</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="165" y="209" width="270" height="231" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="165" y="110" width="270" height="99" fill="#f6f8f2" stroke="#214c43" stroke-width="1.6"/>
<path d="M190 209 L415 209" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6"/>
<text x="480" y="170" font-size="21" fill="#214c43" text-anchor="start">初始水高 0.701 m；柱高 1 m</text>
<path d="M300 135 L300 96" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="165" y="97" font-size="20" fill="#214c43" text-anchor="start">outlet：开放顶部</text>
<rect x="165" y="437" width="270" height="7" fill="#347d6c" stroke="#214c43" stroke-width="1.6"/>
<path d="M215 493 L215 450" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M300 493 L300 450" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M385 493 L385 450" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="300" y="524" font-size="21" fill="#214c43" text-anchor="middle">inlet：整个底面，宽 0.15 m</text>
<circle cx="279" cy="397" r="13" fill="#f6f8f2" stroke="#214c43" stroke-width="1.6"/>
<circle cx="316" cy="350" r="17" fill="#f6f8f2" stroke="#214c43" stroke-width="1.6"/>
<circle cx="257" cy="293" r="12" fill="#f6f8f2" stroke="#214c43" stroke-width="1.6"/>
<circle cx="326" cy="236" r="15" fill="#f6f8f2" stroke="#214c43" stroke-width="1.6"/>
<path d="M370 380 L370 228" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M200 250 L200 388" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="510" y="230" font-size="22" fill="#214c43" text-anchor="start">入口面积：0.15 × 0.1 = 0.015 m²</text>
<text x="510" y="269" font-size="22" fill="#214c43" text-anchor="start">α.air = 0.5，U.air = 0.1 m/s</text>
<text x="510" y="308" font-size="22" fill="#214c43" text-anchor="start">Qg = α.air × U.air × A</text>
<text x="510" y="347" font-size="22" fill="#214c43" text-anchor="start">     = 7.5 × 10⁻⁴ m³/s</text>
<text x="510" y="419" font-size="21" fill="#214c43" text-anchor="start">气相与液相各有速度，压力共同耦合。</text>
<text x="510" y="455" font-size="21" fill="#214c43" text-anchor="start">侧壁无穿透；顶部回流时使用指定相组成。</text>
</g></svg>
