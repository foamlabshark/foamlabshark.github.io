<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">达西速度按总截面积计，孔隙速度按流体面积计</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">达西速度按总截面积计，孔隙速度按流体面积计</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="85" y="165" width="420" height="280" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="150" cy="230" r="38" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="150" cy="365" r="38" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="275" cy="230" r="38" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="275" cy="365" r="38" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="400" cy="230" r="38" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="400" cy="365" r="38" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M70 180 L525 180" fill="none" stroke="#347d6c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M70 297 L525 297" fill="none" stroke="#347d6c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M70 432 L525 432" fill="none" stroke="#347d6c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="610" y="169" font-size="24" fill="#214c43" text-anchor="start">流量 Q = q A = ⟨u⟩f εA</text>
<text x="610" y="220" font-size="24" fill="#214c43" text-anchor="start">q = ε ⟨u⟩f</text>
<text x="610" y="271" font-size="24" fill="#214c43" text-anchor="start">ε：孔隙体积 / 材料总体积</text>
<text x="610" y="374" font-size="21" fill="#214c43" text-anchor="start">周期床用体力或压力梯度驱动。</text>
<text x="610" y="414" font-size="21" fill="#214c43" text-anchor="start">周期面配对，不另设定入口流量。</text>
<text x="610" y="454" font-size="21" fill="#214c43" text-anchor="start">局部多孔区需要指定 cellZone。</text>
<text x="295" y="492" font-size="19" fill="#214c43" text-anchor="middle">橙色颗粒占据固体体积；流体在孔隙内运动。</text>
</g></svg>
