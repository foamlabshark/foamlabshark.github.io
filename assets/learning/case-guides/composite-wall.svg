<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">复合壁：串联热阻决定温降分配</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">复合壁：串联热阻决定温降分配</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="165" y="155" width="330" height="235" fill="url(#material)" stroke="#214c43" stroke-width="1.6"/>
<rect x="495" y="155" width="330" height="235" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="210" y="212" font-size="22" fill="#214c43" text-anchor="start">材料 1</text>
<text x="210" y="252" font-size="22" fill="#214c43" text-anchor="start">热阻 R₁ = L₁ / k₁</text>
<text x="210" y="292" font-size="22" fill="#214c43" text-anchor="start">低导热率 → 温降较大</text>
<text x="550" y="212" font-size="22" fill="#214c43" text-anchor="start">材料 2</text>
<text x="550" y="252" font-size="22" fill="#214c43" text-anchor="start">热阻 R₂ = L₂ / k₂</text>
<text x="550" y="292" font-size="22" fill="#214c43" text-anchor="start">高导热率 → 温降较小</text>
<text x="125" y="428" font-size="22" fill="#214c43" text-anchor="middle">400 K</text>
<text x="860" y="428" font-size="22" fill="#214c43" text-anchor="middle">300 K</text>
<text x="495" y="466" font-size="23" fill="#214c43" text-anchor="middle">界面温度相同；两侧外法向相反，流出热流相抵。</text>
<path d="M355 354 L655 354" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="495" y="134" font-size="22" fill="#214c43" text-anchor="middle">材料界面</text>
</g></svg>
