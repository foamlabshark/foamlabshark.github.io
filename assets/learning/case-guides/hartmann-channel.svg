<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">哈特曼流：横向磁场抑制流体运动</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">哈特曼流：横向磁场抑制流体运动</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="120" y="185" width="850" height="230" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="120" y="175" width="850" height="10" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="120" y="415" width="850" height="10" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M200 300 L450 300" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="220" y="275" font-size="22" fill="#214c43" text-anchor="start">U 沿 x</text>
<path d="M555 390 L555 205" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="575" y="238" font-size="22" fill="#214c43" text-anchor="start">B 沿 y</text>
<circle cx="725" cy="300" r="17" fill="none" stroke="#214c43" stroke-width="1.6"/>
<circle cx="725" cy="300" r="3" fill="#347d6c" stroke="#214c43" stroke-width="1.6"/>
<text x="750" y="308" font-size="20" fill="#214c43" text-anchor="start">U × B 沿 +z</text>
<path d="M480 365 L310 365" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="275" y="475" font-size="23" fill="#214c43" text-anchor="start">感应电流与磁场产生洛伦兹力，改变速度剖面。</text>
<text x="32" y="536" font-size="20" fill="#587169" text-anchor="start">图示坐标取 x 向右、y 向上、z 朝向读者；电流还受电势与电边界影响。</text>
</g></svg>
