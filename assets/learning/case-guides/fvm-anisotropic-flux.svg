<text x="238" y="158" font-size="21" fill="#214c43" text-anchor="start">∇φ = (0, 1)</text>
<path d="M285 340 L189 436" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="85" y="474" font-size="21" fill="#214c43" text-anchor="start">q = (−1, −1)</text>
<text x="665" y="167" font-size="24" fill="#214c43" text-anchor="start">例：κ = [ 2  1 ]</text>
<text x="665" y="212" font-size="24" fill="#214c43" text-anchor="start">             [ 1  1 ]</text>
<text x="665" y="257" font-size="24" fill="#214c43" text-anchor="start">q = −κ · ∇φ = (−1, −1)</text>
<text x="665" y="373" font-size="23" fill="#214c43" text-anchor="start">非对角项将方向耦合。</text>
<text x="665" y="417" font-size="23" fill="#214c43" text-anchor="start">面通量还需取 q · Sf。</text>
