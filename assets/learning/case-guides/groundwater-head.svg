<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">水头梯度决定渗流方向，抽水使井周水头下降</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">水头梯度决定渗流方向，抽水使井周水头下降</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="70" y="180" width="445" height="220" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="70" y="148" font-size="22" fill="#214c43" text-anchor="start">h = 10 m</text>
<text x="515" y="148" font-size="22" fill="#214c43" text-anchor="end">h = 9 m</text>
<path d="M95 310 L482 310" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="292" y="265" font-size="22" fill="#214c43" text-anchor="middle">均匀介质</text>
<path d="M70 436 L515 436" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M70 430 L70 442" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M515 430 L515 442" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<text x="292.5" y="464" font-size="20" fill="#214c43" text-anchor="middle">L = 1 m；h(x) = 10 − x</text>
<circle cx="815" cy="300" r="55" fill="none" stroke="#214c43" stroke-width="1.6" stroke-dasharray="7 6"/>
<circle cx="815" cy="300" r="95" fill="none" stroke="#214c43" stroke-width="1.6" stroke-dasharray="7 6"/>
<circle cx="815" cy="300" r="140" fill="none" stroke="#214c43" stroke-width="1.6" stroke-dasharray="7 6"/>
<circle cx="815" cy="300" r="12" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M947.0 300.0 L840.0 300.0" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M815.0 432.0 L815.0 325.0" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M683.0 300.0 L790.0 300.0" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M815.0 168.0 L815.0 275.0" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="815" y="136" font-size="22" fill="#214c43" text-anchor="middle">抽水井的平面径向汇流</text>
<text x="815" y="481" font-size="22" fill="#214c43" text-anchor="middle">同心线：等水头线</text>
</g></svg>
