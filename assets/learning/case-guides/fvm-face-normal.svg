<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">内部面的法向与两个单元的收支符号</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">内部面的法向与两个单元的收支符号</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="130" y="170" width="370" height="260" fill="url(#material)" stroke="#214c43" stroke-width="1.6"/>
<rect x="500" y="170" width="370" height="260" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="300" cy="330" r="6" fill="#214c43" stroke="#214c43" stroke-width="1.6"/>
<circle cx="705" cy="280" r="6" fill="#214c43" stroke="#214c43" stroke-width="1.6"/>
<path d="M300 330 L705 280" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6"/>
<text x="285" y="366" font-size="22" fill="#214c43" text-anchor="middle">owner / C</text>
<text x="737" y="250" font-size="22" fill="#214c43" text-anchor="middle">neighbour / F</text>
<path d="M500 167 L500 433" fill="none" stroke="#347d6c" stroke-width="4"/>
<circle cx="500" cy="300" r="6" fill="#214c43" stroke="#214c43" stroke-width="1.6"/>
<path d="M505 300 L636 300" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="585" y="330" font-size="22" fill="#214c43" text-anchor="middle">Sf</text>
<text x="500" y="141" font-size="22" fill="#214c43" text-anchor="middle">公共面 f</text>
<text x="500" y="489" font-size="22" fill="#214c43" text-anchor="middle">owner 采用 +Ff；neighbour 采用 −Ff；内部交换在全域求和中抵消。</text>
</g></svg>
