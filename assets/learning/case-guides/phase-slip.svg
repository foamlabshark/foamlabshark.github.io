<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">相间滑移使曳力与气泡尺度相联系</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">相间滑移使曳力与气泡尺度相联系</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="85" y="140" width="350" height="330" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<circle cx="260" cy="320" r="55" fill="#f6f8f2" stroke="#214c43" stroke-width="1.6"/>
<path d="M260 300 L260 180" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="290" y="199" font-size="22" fill="#214c43" text-anchor="start">U.air</text>
<path d="M130 300 L130 240" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="145" y="265" font-size="20" fill="#214c43" text-anchor="start">U.water</text>
<path d="M260 332 L260 434" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="290" y="422" font-size="20" fill="#214c43" text-anchor="start">气相所受曳力</text>
<text x="510" y="184" font-size="22" fill="#214c43" text-anchor="start">滑移速度 = U.air − U.water</text>
<text x="510" y="229" font-size="22" fill="#214c43" text-anchor="start">曳力阻碍两相相对运动。</text>
<text x="510" y="274" font-size="22" fill="#214c43" text-anchor="start">作用在液相上的交换力方向相反。</text>
<text x="510" y="351" font-size="21" fill="#214c43" text-anchor="start">同一气含率下，球形气泡的界面面积密度</text>
<text x="510" y="393" font-size="21" fill="#214c43" text-anchor="start">a = 6α.air / d</text>
<text x="510" y="435" font-size="21" fill="#214c43" text-anchor="start">气泡直径越小，单位体积界面越多。</text>
</g></svg>
