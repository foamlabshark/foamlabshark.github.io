<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">欠松弛：只接受本轮计算增量的一部分</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">欠松弛：只接受本轮计算增量的一部分</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<path d="M120 300 L970 300" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="185" cy="300" r="8" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<text x="185" y="257" font-size="25" fill="#214c43" text-anchor="middle">旧值 φ*</text>
<text x="185" y="354" font-size="23" fill="#214c43" text-anchor="middle">本轮起点</text>
<circle cx="460" cy="300" r="8" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<text x="460" y="257" font-size="25" fill="#214c43" text-anchor="middle">更新值</text>
<text x="460" y="354" font-size="23" fill="#214c43" text-anchor="middle">φ* + λ Δφ</text>
<circle cx="880" cy="300" r="8" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<text x="880" y="257" font-size="25" fill="#214c43" text-anchor="middle">未松弛新值</text>
<text x="880" y="354" font-size="23" fill="#214c43" text-anchor="middle">φ* + Δφ</text>
<path d="M185 420 L460 420" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M185 414 L185 426" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M460 414 L460 426" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<text x="322.5" y="448" font-size="20" fill="#214c43" text-anchor="middle">接受 λ Δφ</text>
<text x="530" y="148" font-size="26" fill="#214c43" text-anchor="middle">0 &lt; λ ≤ 1；λ 越小，每轮改变越缓和。</text>
<text x="32" y="536" font-size="20" fill="#587169" text-anchor="start">场松弛直接缩小增量；方程松弛通过修改对角与右端实现稳定更新。</text>
</g></svg>
