<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">竖直加热通道中的强制流动与浮力</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">竖直加热通道中的强制流动与浮力</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="235" y="145" width="250" height="300" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="223" y="145" width="12" height="300" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="485" y="145" width="12" height="300" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M360 490 L360 185" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="525" font-size="22" fill="#214c43" text-anchor="middle">入口 Vin、Tin</text>
<text x="200" y="260" font-size="22" fill="#214c43" text-anchor="end">Tw</text>
<text x="510" y="260" font-size="22" fill="#214c43" text-anchor="start">Tw</text>
<path d="M235 116 L485 116" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M235 110 L235 122" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M485 110 L485 122" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<text x="360.0" y="144" font-size="20" fill="#214c43" text-anchor="middle">W</text>
<path d="M605 160 L605 432" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="625" y="310" font-size="22" fill="#214c43" text-anchor="start">g</text>
<text x="755" y="177" font-size="22" fill="#214c43" text-anchor="start">x：跨通道方向</text>
<text x="755" y="225" font-size="22" fill="#214c43" text-anchor="start">y：竖直向上</text>
<text x="755" y="273" font-size="22" fill="#214c43" text-anchor="start">Re：惯性 / 黏性</text>
<text x="755" y="321" font-size="22" fill="#214c43" text-anchor="start">Pr：动量 / 热扩散</text>
<text x="755" y="369" font-size="22" fill="#214c43" text-anchor="start">Ri = Gr/Re²</text>
<text x="755" y="417" font-size="22" fill="#214c43" text-anchor="start">浮力 / 强制流动惯性</text>
</g></svg>
