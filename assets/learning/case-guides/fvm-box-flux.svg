<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">长方体的六个外法向按相对面成对检查</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">长方体的六个外法向按相对面成对检查</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="155" y="150" width="300" height="330" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="305" y="130" font-size="22" fill="#214c43" text-anchor="middle" font-weight="700">x–z 截面</text>
<path d="M155 315 L85 315" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M455 315 L535 315" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M305 150 L305 102" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M305 480 L305 524" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="130" y="283" font-size="22" fill="#214c43" text-anchor="end">−ex</text>
<text x="480" y="283" font-size="22" fill="#214c43" text-anchor="start">+ex</text>
<text x="368" y="105" font-size="22" fill="#214c43" text-anchor="start">+ez</text>
<text x="328" y="524" font-size="22" fill="#214c43" text-anchor="start">−ez</text>
<text x="660" y="165" font-size="23" fill="#214c43" text-anchor="start">x ∈ [−2, 2]</text>
<text x="660" y="213" font-size="23" fill="#214c43" text-anchor="start">y ∈ [−1, 1]</text>
<text x="660" y="261" font-size="23" fill="#214c43" text-anchor="start">z ∈ [−4, 4]</text>
<text x="660" y="309" font-size="23" fill="#214c43" text-anchor="start">另两个面：y = ±1，n = ±ey</text>
<text x="660" y="357" font-size="23" fill="#214c43" text-anchor="start">同一对面上场分量相同，</text>
<text x="660" y="405" font-size="23" fill="#214c43" text-anchor="start">外法向相反，通量相消。</text>
</g></svg>
