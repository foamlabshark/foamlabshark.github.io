<svg xmlns="http://www.w3.org/2000/svg" viewBox="61 58 923 496" role="img" aria-labelledby="title desc" width="923" height="496">
<title id="title">长方体的六个外法向按相对面成对检查</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#348c95"></path></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#d9eaf0"></stop><stop offset="1" stop-color="#9bceda"></stop></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"></stop><stop offset="1" stop-color="#c79553"></stop></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"></stop><stop offset="1" stop-color="#e4c99f"></stop></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect class="diagram-background" width="923" height="496" rx="18" fill="#f5f4eb" x="61" y="58"></rect><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#294f49" stroke-linejoin="round" stroke-linecap="round" class="diagram-content">
<rect x="155" y="150" width="300" height="330" fill="url(#fluid)" stroke="#294f49" stroke-width="1.6"></rect>
<text x="305" y="130" font-size="22" fill="#294f49" text-anchor="middle">x–z 截面</text>
<path d="M155 315 L85 315" fill="none" stroke="#348c95" stroke-width="3" marker-end="url(#arrow)"></path>
<path d="M455 315 L535 315" fill="none" stroke="#348c95" stroke-width="3" marker-end="url(#arrow)"></path>
<path d="M305 150 L305 102" fill="none" stroke="#348c95" stroke-width="3" marker-end="url(#arrow)"></path>
<path d="M305 480 L305 524" fill="none" stroke="#348c95" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="130" y="283" font-size="22" fill="#294f49" text-anchor="end">−ex</text>
<text x="480" y="283" font-size="22" fill="#294f49" text-anchor="start">+ex</text>
<text x="368" y="105" font-size="22" fill="#294f49" text-anchor="start">+ez</text>
<text x="328" y="524" font-size="22" fill="#294f49" text-anchor="start">−ez</text>
<text x="660" y="165" font-size="23" fill="#294f49" text-anchor="start">x ∈ [−2, 2]</text>
<text x="660" y="213" font-size="23" fill="#294f49" text-anchor="start">y ∈ [−1, 1]</text>
<text x="660" y="261" font-size="23" fill="#294f49" text-anchor="start">z ∈ [−4, 4]</text>
<text x="660" y="309" font-size="23" fill="#294f49" text-anchor="start">另两个面：y = ±1，n = ±ey</text>
</g></svg>
