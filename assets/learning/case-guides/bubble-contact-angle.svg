<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">接触角从液体一侧量取</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">接触角从液体一侧量取</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="100" y="418" width="510" height="20" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M210 418 A130 130 0 0 1 470 418 Z" fill="#dfede6" stroke="#347d6c" stroke-width="3"/>
<text x="340" y="350" font-size="22" fill="#214c43" text-anchor="middle">气体</text>
<text x="530" y="342" font-size="22" fill="#214c43" text-anchor="middle">液体</text>
<path d="M470 418 L470 277" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M510 418 A40 40 0 0 0 470 378" fill="none" stroke="#347d6c" stroke-width="2"/>
<text x="508" y="387" font-size="20" fill="#214c43" text-anchor="start">θ液 = 90°</text>
<path d="M340 280 L340 170" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="367" y="203" font-size="22" fill="#214c43" text-anchor="start">浮力</text>
<text x="340" y="477" font-size="21" fill="#214c43" text-anchor="middle">接触线：气、液、固三相交汇处</text>
<text x="675" y="203" font-size="21" fill="#214c43" text-anchor="start">θ 的量取相必须与 α 字段一致。</text>
<text x="675" y="252" font-size="21" fill="#214c43" text-anchor="start">接触角决定靠壁界面法向。</text>
<text x="675" y="301" font-size="21" fill="#214c43" text-anchor="start">法向改变曲率及表面张力。</text>
<text x="675" y="391" font-size="21" fill="#214c43" text-anchor="start">脱离还取决于体积、重力、</text>
<text x="675" y="430" font-size="21" fill="#214c43" text-anchor="start">接触线约束与流体运动。</text>
</g></svg>
