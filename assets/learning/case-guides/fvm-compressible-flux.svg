<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">可压缩面流率同时受密度与速度影响</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">可压缩面流率同时受密度与速度影响</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="80" y="180" width="330" height="220" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="410" y="180" width="330" height="220" fill="url(#material)" stroke="#214c43" stroke-width="1.6"/>
<path d="M410 165 L410 416" fill="none" stroke="#347d6c" stroke-width="4"/>
<path d="M310 290 L550 290" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="410" y="142" font-size="22" fill="#214c43" text-anchor="middle">公共面 f</text>
<text x="270" y="352" font-size="25" fill="#214c43" text-anchor="middle">ρf</text>
<text x="570" y="350" font-size="25" fill="#214c43" text-anchor="middle">Uf · Sf</text>
<text x="775" y="180" font-size="22" fill="#214c43" text-anchor="start">质量流率</text>
<text x="775" y="228" font-size="22" fill="#214c43" text-anchor="start">ṁf = ρf Uf · Sf</text>
<text x="775" y="276" font-size="22" fill="#214c43" text-anchor="start">压力修正引起：</text>
<text x="775" y="324" font-size="22" fill="#214c43" text-anchor="start">① 密度修正 ρ′</text>
<text x="775" y="372" font-size="22" fill="#214c43" text-anchor="start">② 速度修正 U′</text>
<text x="450" y="476" font-size="28" fill="#214c43" text-anchor="middle">ṁ′f ≈ ρ′f U*f · Sf + ρ*f U′f · Sf</text>
</g></svg>
