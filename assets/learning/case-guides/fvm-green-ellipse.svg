<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">椭圆面积：沿闭合边界作正向积分</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">椭圆面积：沿闭合边界作正向积分</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<path d="M600 300 A225 130 0 1 0 150 300 A225 130 0 1 0 600 300 Z" fill="#dfede6" stroke="#347d6c" stroke-width="3"/>
<path d="M375 300 L655 300" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M375 300 L375 110" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="665" y="308" font-size="20" fill="#214c43" text-anchor="start">x</text>
<text x="365" y="98" font-size="20" fill="#214c43" text-anchor="end">y</text>
<path d="M375 300 L105 300" fill="none" stroke="#347d6c" stroke-width="1"/>
<path d="M375 300 L375 459" fill="none" stroke="#347d6c" stroke-width="1"/>
<text x="586" y="334" font-size="22" fill="#214c43" text-anchor="start">a</text>
<text x="350" y="186" font-size="22" fill="#214c43" text-anchor="start">b</text>
<path d="M587 258 Q566 213 495 188" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="206" font-size="23" fill="#214c43" text-anchor="start">x = a cos t</text>
<text x="720" y="255" font-size="23" fill="#214c43" text-anchor="start">y = b sin t</text>
<text x="720" y="304" font-size="23" fill="#214c43" text-anchor="start">0 ≤ t ≤ 2π</text>
<text x="720" y="353" font-size="23" fill="#214c43" text-anchor="start">从 +z 方向看为逆时针。</text>
<text x="375" y="511" font-size="25" fill="#214c43" text-anchor="middle">面积 = ½ ∮ (x dy − y dx)</text>
</g></svg>
