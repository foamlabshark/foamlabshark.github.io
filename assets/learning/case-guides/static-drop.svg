<text x="235.0" y="523" font-size="20" fill="#214c43" text-anchor="middle">x、z 各 1 m</text>
<circle cx="235" cy="310" r="2.5" fill="#347d6c" stroke="#214c43" stroke-width="1.6"/>
<circle cx="358" cy="310" r="3" fill="#347d6c" stroke="#214c43" stroke-width="1.6"/>
<text x="470" y="160" font-size="22" fill="#214c43" text-anchor="start">本例：圆柱界面的二维截面</text>
<text x="470" y="197" font-size="22" fill="#214c43" text-anchor="start">厚度方向为 empty，第二主曲率为零</text>
<text x="470" y="269" font-size="25" fill="#214c43" text-anchor="start">κ = 1/R</text>
<text x="470" y="312" font-size="25" fill="#214c43" text-anchor="start">p内 − p外 = σ/R = 0.35 Pa</text>
<text x="470" y="355" font-size="25" fill="#214c43" text-anchor="start">σ = 0.07 N/m；静止时 U = 0</text>
<path d="M470 398 L1005 398" fill="none" stroke="#347d6c" stroke-width="1"/>
<text x="470" y="437" font-size="22" fill="#214c43" text-anchor="start">三维球形液滴有两个相同的主曲率</text>
<text x="470" y="474" font-size="22" fill="#214c43" text-anchor="start">κ = 2/R，因此球形液滴 Δp = 2σ/R</text>
