<path d="M235 310 L301 310" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="235" y="285" font-size="18" fill="#214c43" text-anchor="middle">R = 0.2 m</text>
<text x="235" y="335" font-size="22" fill="#214c43" text-anchor="middle">水</text>
<text x="127" y="204" font-size="22" fill="#214c43" text-anchor="start">空气</text>
<path d="M70 495 L400 495" fill="none" stroke="#347d6c" stroke-width="1.5"/>
