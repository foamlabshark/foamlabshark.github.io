<text x="155" y="198" font-size="23" fill="#214c43" text-anchor="start">注入端 Sw = 1</text>
<text x="695" y="230" font-size="23" fill="#214c43" text-anchor="start">初始油区</text>
<path d="M60 244 L260 244" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
