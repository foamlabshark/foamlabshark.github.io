<text x="940" y="463" font-size="20" fill="#214c43" text-anchor="start">x</text>
<text x="110" y="323" font-size="20" fill="#214c43" text-anchor="end">Sw</text>
<path d="M120 345 Q320 356 490 391 L490 455 H914" fill="none" stroke="#347d6c" stroke-width="4"/>
