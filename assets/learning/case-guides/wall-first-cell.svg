<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">y⁺ 使用壁面到第一层单元中心的距离</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">y⁺ 使用壁面到第一层单元中心的距离</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="80" y="427" width="420" height="23" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="80" y="327" width="420" height="100" fill="none" stroke="#214c43" stroke-width="1.6"/>
<rect x="80" y="222" width="420" height="105" fill="none" stroke="#214c43" stroke-width="1.6"/>
<rect x="80" y="115" width="420" height="107" fill="none" stroke="#214c43" stroke-width="1.6"/>
<circle cx="290" cy="377" r="6" fill="#214c43" stroke="#214c43" stroke-width="1.6"/>
<text x="315" y="385" font-size="22" fill="#214c43" text-anchor="start">单元中心 C</text>
<path d="M175 427 L175 377" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="145" y="404" font-size="22" fill="#214c43" text-anchor="end">y</text>
<path d="M525 427 L525 327" fill="none" stroke="#347d6c" stroke-width="3"/>
<text x="540" y="459" font-size="20" fill="#214c43" text-anchor="start">第一层厚度 ≈ 2y</text>
<text x="660" y="167" font-size="23" fill="#214c43" text-anchor="start">y⁺ = uτ y / ν</text>
<text x="660" y="218" font-size="23" fill="#214c43" text-anchor="start">uτ = √(τw / ρ)</text>
<text x="660" y="269" font-size="23" fill="#214c43" text-anchor="start">U：壁面速度条件</text>
<text x="660" y="320" font-size="23" fill="#214c43" text-anchor="start">nut：近壁涡黏度</text>
<text x="660" y="371" font-size="23" fill="#214c43" text-anchor="start">ω 或 ε：湍流尺度</text>
<text x="32" y="536" font-size="20" fill="#587169" text-anchor="start">先确认距离取到单元中心，再将网格分辨率与壁面模型配套。</text>
</g></svg>
