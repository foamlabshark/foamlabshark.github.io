<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">把进出通量与域内储存量放在同一张收支图中</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">把进出通量与域内储存量放在同一张收支图中</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="330" y="160" width="400" height="220" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="530" y="225" font-size="22" fill="#214c43" text-anchor="middle" font-weight="700">控制体</text>
<text x="530" y="275" font-size="22" fill="#214c43" text-anchor="middle">储存量 N(t)</text>
<text x="530" y="324" font-size="22" fill="#214c43" text-anchor="middle">相体积：Σ αᵢ Vᵢ</text>
<path d="M65 260 L310 260" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="70" y="235" font-size="22" fill="#214c43" text-anchor="start">入口流率</text>
<path d="M750 260 L995 260" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="835" y="235" font-size="22" fill="#214c43" text-anchor="start">出口流率</text>
<path d="M530 105 L530 145" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="124" font-size="22" fill="#214c43" text-anchor="start">源项 / 壁面供给</text>
<text x="530" y="442" font-size="26" fill="#214c43" text-anchor="middle">储存量变化率 = 流入 − 流出 + 域内生成</text>
<text x="32" y="536" font-size="20" fill="#587169" text-anchor="start">瞬态计算保留储存项；稳态计算检查各流率之和。</text>
</g></svg>
