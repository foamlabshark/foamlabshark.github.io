<svg xmlns="http://www.w3.org/2000/svg" viewBox="101 89 914 416" role="img" aria-labelledby="title desc" width="914" height="416">
<title id="title">上半立方体：五个外表面共用底部边界曲线</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#348c95"></path></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#d9eaf0"></stop><stop offset="1" stop-color="#9bceda"></stop></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"></stop><stop offset="1" stop-color="#c79553"></stop></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"></stop><stop offset="1" stop-color="#e4c99f"></stop></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect class="diagram-background" width="914" height="416" rx="18" fill="#f5f4eb" x="101" y="89"></rect><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#294f49" stroke-linejoin="round" stroke-linecap="round" class="diagram-content">
<rect x="125" y="185" width="300" height="250" fill="url(#fluid)" stroke="#294f49" stroke-width="1.6"></rect>
<path d="M140 435 H425 V185 H125 V420" fill="none" stroke="#348c95" stroke-width="4" marker-end="url(#arrow)"></path>
<text x="275" y="148" font-size="22" fill="#294f49" text-anchor="middle">C：z = 0 的正方形</text>
<text x="275" y="308" font-size="22" fill="#294f49" text-anchor="middle">从 +z 方向俯视</text>
<text x="275" y="476" font-size="21" fill="#294f49" text-anchor="middle">沿 C 逆时针，与曲面外法向相容</text>
<rect x="685" y="225" width="240" height="200" fill="url(#fluid)" stroke="#294f49" stroke-width="1.6"></rect>
<path d="M685 425 L925 425" fill="none" stroke="#348c95" stroke-width="3" stroke-dasharray="7 6"></path>
<text x="805" y="136" font-size="22" fill="#294f49" text-anchor="middle">侧视：0 ≤ z ≤ 1</text>
<path d="M805 225 L805 165" fill="none" stroke="#348c95" stroke-width="3" marker-end="url(#arrow)"></path>
<path d="M685 320 L626 320" fill="none" stroke="#348c95" stroke-width="3" marker-end="url(#arrow)"></path>
<path d="M925 320 L991 320" fill="none" stroke="#348c95" stroke-width="3" marker-end="url(#arrow)"></path>
<text x="805" y="476" font-size="21" fill="#294f49" text-anchor="middle">底面不计入曲面，底边组成 C</text>
</g></svg>
