<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">上半立方体：五个外表面共用底部边界曲线</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">上半立方体：五个外表面共用底部边界曲线</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="125" y="185" width="300" height="250" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M125 420 V185 H425 V435 H140" fill="none" stroke="#347d6c" stroke-width="4" marker-end="url(#arrow)"/>
<text x="275" y="148" font-size="22" fill="#214c43" text-anchor="middle" font-weight="700">C：z = 0 的正方形</text>
<text x="275" y="308" font-size="22" fill="#214c43" text-anchor="middle">从 +z 方向俯视</text>
<text x="275" y="476" font-size="21" fill="#214c43" text-anchor="middle">沿 C 逆时针，与曲面外法向相容</text>
<rect x="685" y="225" width="240" height="200" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M685 425 L925 425" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6"/>
<text x="805" y="195" font-size="22" fill="#214c43" text-anchor="middle" font-weight="700">侧视：0 ≤ z ≤ 1</text>
<path d="M805 225 L805 165" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M685 320 L626 320" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M925 320 L991 320" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="805" y="476" font-size="21" fill="#214c43" text-anchor="middle">底面不计入曲面，底边组成 C</text>
</g></svg>
