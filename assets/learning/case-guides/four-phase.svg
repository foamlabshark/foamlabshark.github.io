<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">多相体积分数与两两相间作用</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">多相体积分数与两两相间作用</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="90" y="150" width="90" height="280" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="135" y="468" font-size="19" fill="#214c43" text-anchor="middle">water</text>
<rect x="180" y="150" width="90" height="280" fill="url(#material)" stroke="#214c43" stroke-width="1.6"/>
<text x="225" y="468" font-size="19" fill="#214c43" text-anchor="middle">oil</text>
<rect x="270" y="150" width="90" height="280" fill="#bfd4c6" stroke="#214c43" stroke-width="1.6"/>
<text x="315" y="468" font-size="19" fill="#214c43" text-anchor="middle">mercury</text>
<rect x="360" y="150" width="90" height="280" fill="#e8edce" stroke="#214c43" stroke-width="1.6"/>
<text x="405" y="468" font-size="19" fill="#214c43" text-anchor="middle">air</text>
<text x="270" y="126" font-size="21" fill="#214c43" text-anchor="middle">一个控制体内的相体积份额</text>
<text x="550" y="172" font-size="22" fill="#214c43" text-anchor="start">每一相：αᵢ、ρᵢ、νᵢ</text>
<text x="550" y="214" font-size="22" fill="#214c43" text-anchor="start">同一单元：Σ αᵢ = 1</text>
<text x="550" y="256" font-size="22" fill="#214c43" text-anchor="start">四相共有六种不同的相对</text>
<path d="M625 365 L870 365" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M625 365 L625 465" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M625 365 L870 465" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M870 365 L625 465" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M870 365 L870 465" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M625 465 L870 465" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<circle cx="625" cy="365" r="22" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="625" y="372" font-size="22" fill="#214c43" text-anchor="middle">1</text>
<circle cx="870" cy="365" r="22" fill="url(#material)" stroke="#214c43" stroke-width="1.6"/>
<text x="870" y="372" font-size="22" fill="#214c43" text-anchor="middle">2</text>
<circle cx="625" cy="465" r="22" fill="#bfd4c6" stroke="#214c43" stroke-width="1.6"/>
<text x="625" y="472" font-size="22" fill="#214c43" text-anchor="middle">3</text>
<circle cx="870" cy="465" r="22" fill="#e8edce" stroke="#214c43" stroke-width="1.6"/>
<text x="870" y="472" font-size="22" fill="#214c43" text-anchor="middle">4</text>
</g></svg>
