<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">压力修正使预测通量满足连续性</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">压力修正使预测通量满足连续性</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="50" y="205" width="225" height="160" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="162" y="261" font-size="23" fill="#214c43" text-anchor="middle" font-weight="700">动量预测</text>
<text x="162" y="315" font-size="18" fill="#214c43" text-anchor="middle">得到 U* 与面通量 φ*</text>
<path d="M280 285 L303 285" fill="none" stroke="#347d6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="309" y="205" width="225" height="160" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="421" y="261" font-size="23" fill="#214c43" text-anchor="middle" font-weight="700">质量不平衡</text>
<text x="421" y="315" font-size="18" fill="#214c43" text-anchor="middle">各面流率之和</text>
<path d="M539 285 L562 285" fill="none" stroke="#347d6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="568" y="205" width="225" height="160" fill="url(#material)" stroke="#214c43" stroke-width="1.6"/>
<text x="680" y="261" font-size="23" fill="#214c43" text-anchor="middle" font-weight="700">压力修正</text>
<text x="680" y="315" font-size="18" fill="#214c43" text-anchor="middle">求 p′，校正通量</text>
<path d="M798 285 L821 285" fill="none" stroke="#347d6c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="827" y="205" width="225" height="160" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="939" y="261" font-size="23" fill="#214c43" text-anchor="middle" font-weight="700">更新场</text>
<text x="939" y="315" font-size="18" fill="#214c43" text-anchor="middle">更新 p、U 与 φ</text>
<path d="M940 380 V446 H150 V380" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="540" y="490" font-size="24" fill="#214c43" text-anchor="middle">检查收敛；未满足条件时进入下一轮。</text>
</g></svg>
