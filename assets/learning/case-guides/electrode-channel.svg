<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">通道电极：对流补给与壁面反应消耗</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">通道电极：对流补给与壁面反应消耗</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="115" y="185" width="830" height="215" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<rect x="330" y="400" width="400" height="15" fill="url(#solid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M75 275 L240 275" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="90" y="154" font-size="21" fill="#214c43" text-anchor="start">入口：主体浓度、规定流速</text>
<path d="M795 275 L1000 275" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="850" y="151" font-size="21" fill="#214c43" text-anchor="start">出口</text>
<path d="M385 286 L385 389" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M510 286 L510 389" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M640 286 L640 389" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="530" y="455" font-size="23" fill="#214c43" text-anchor="middle">反应电极：物质通量与反应电流耦合</text>
<text x="530" y="231" font-size="23" fill="#214c43" text-anchor="middle">流动沿通道补给反应物</text>
<text x="530" y="356" font-size="23" fill="#214c43" text-anchor="middle">扩散跨越近壁浓度梯度</text>
<text x="32" y="536" font-size="20" fill="#587169" text-anchor="start">反应增强使表面浓度降低；接近零时，物质供给限制电流。</text>
</g></svg>
