<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">周期盒：离开一个边界，就从配对边界进入</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">周期盒：离开一个边界，就从配对边界进入</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="175" y="160" width="700" height="240" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M545 162 L545 114" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M545 448 L545 402" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="215" y="473" font-size="22" fill="#214c43" text-anchor="start">三个方向均为周期配对，空间中没有入口或出口。</text>
<text x="215" y="505" font-size="22" fill="#214c43" text-anchor="start">随机驱动补充动能；黏性耗散消耗动能。</text>
<path d="M95 280 L240 280" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M780 280 L980 280" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M965 280 Q1000 93 525 95 Q60 90 105 260" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="525" y="241" font-size="22" fill="#214c43" text-anchor="middle" font-weight="700">计算区域</text>
<path d="M360 315 L680 315" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="525" y="355" font-size="22" fill="#214c43" text-anchor="middle">驱动作用于域内</text>
</g></svg>
