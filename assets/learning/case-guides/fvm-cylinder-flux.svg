<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">闭合圆柱：分别计算两端面与侧面通量</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">闭合圆柱：分别计算两端面与侧面通量</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<rect x="180" y="195" width="520" height="230" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<path d="M120 310 L790 310" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="808" y="337" font-size="22" fill="#214c43" text-anchor="start">x</text>
<path d="M180 269 L105 269" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M700 269 L790 269" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M440 195 L440 131" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M440 425 L440 490" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="180" y="465" font-size="22" fill="#214c43" text-anchor="middle">x = 0</text>
<text x="700" y="465" font-size="22" fill="#214c43" text-anchor="middle">x = h</text>
<text x="420" y="118" font-size="22" fill="#214c43" text-anchor="start">侧面外法向</text>
<path d="M195 328 L195 424" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M189 328 L201 328" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<path d="M189 424 L201 424" fill="none" stroke="#347d6c" stroke-width="1.5"/>
<text x="207" y="376.0" font-size="20" fill="#214c43" text-anchor="start">r</text>
<text x="845" y="183" font-size="22" fill="#214c43" text-anchor="start">F = (x, y, z)</text>
<text x="845" y="234" font-size="22" fill="#214c43" text-anchor="start">左端：0</text>
<text x="845" y="285" font-size="22" fill="#214c43" text-anchor="start">右端：hπr²</text>
<text x="845" y="336" font-size="22" fill="#214c43" text-anchor="start">侧面：2πr²h</text>
</g></svg>
