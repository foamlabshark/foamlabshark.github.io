<text x="570" y="179" font-size="24" fill="#214c43" text-anchor="start">外圆 bulk：r = 1 mm</text>
<text x="570" y="224" font-size="24" fill="#214c43" text-anchor="start">c = 2 mol/m³</text>
<text x="570" y="269" font-size="24" fill="#214c43" text-anchor="start">内圆 bubble：r = 0.1 mm</text>
<text x="570" y="314" font-size="24" fill="#214c43" text-anchor="start">c = 1 mol/m³</text>
<text x="570" y="409" font-size="22" fill="#214c43" text-anchor="start">只求解两圆之间的液体。</text>
<text x="570" y="448" font-size="22" fill="#214c43" text-anchor="start">厚度 0.1 mm，采用圆柱扩散关系。</text>
<text x="300" y="511" font-size="22" fill="#214c43" text-anchor="middle">高浓度液体 → 气液界面</text>
