<text x="465" y="408" font-size="20" fill="#214c43" text-anchor="start">x</text>
<text x="60" y="188" font-size="20" fill="#214c43" text-anchor="end">φ</text>
<text x="800" y="155" font-size="24" fill="#214c43" text-anchor="middle" font-weight="700">扩散：分布逐渐展宽</text>
<path d="M610 400 L995 400" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M610 400 L610 200" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1005" y="408" font-size="20" fill="#214c43" text-anchor="start">x</text>
<text x="600" y="188" font-size="20" fill="#214c43" text-anchor="end">φ</text>
<path d="M90 399 L160 399 L160 245 L240 245 L240 399 L435 399" fill="none" stroke="#347d6c" stroke-width="3"/>
