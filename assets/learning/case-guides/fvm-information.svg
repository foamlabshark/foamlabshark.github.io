<path d="M245 210 L330 210" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630 399 Q735 399 770 260 Q800 145 835 285 Q860 399 980 399" fill="none" stroke="#347d6c" stroke-width="3"/>
<path d="M630 395 Q700 388 754 334 Q805 285 854 334 Q910 388 980 395" fill="none" stroke="#347d6c" stroke-width="3" stroke-dasharray="7 6"/>
<text x="535" y="480" font-size="21" fill="#214c43" text-anchor="middle">实线为初始分布，虚线为较晚时刻；有界封闭系统中积分总量保持不变。</text>
