<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">时间平均：每个值按它代表的时间长度计权</title><desc id="desc"></desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9L2 5Z" fill="#347d6c"/></marker><linearGradient id="fluid" x2="0" y2="1"><stop stop-color="#e8f2eb"/><stop offset="1" stop-color="#cfe2d7"/></linearGradient><linearGradient id="solid" x2="0" y2="1"><stop stop-color="#e4ba79"/><stop offset="1" stop-color="#c79553"/></linearGradient><linearGradient id="material" x2="0" y2="1"><stop stop-color="#f1dfc2"/><stop offset="1" stop-color="#e4c99f"/></linearGradient><style>text{font-variant-numeric:tabular-nums}path,rect,circle{vector-effect:non-scaling-stroke}</style></defs>
<rect width="1080" height="560" rx="14" fill="#f6f8f2"/>
<rect x="1" y="1" width="1078" height="558" rx="14" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" fill="#214c43" stroke-linejoin="round" stroke-linecap="round">
<text x="32" y="44" font-size="28" fill="#214c43" text-anchor="start" font-weight="700">时间平均：每个值按它代表的时间长度计权</text>
<path d="M32 92 L1048 92" fill="none" stroke="#d9e3d8" stroke-width="1"/>
<path d="M100 410 L970 410" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M100 410 L100 140" fill="none" stroke="#347d6c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="980" y="418" font-size="20" fill="#214c43" text-anchor="start">t</text>
<text x="90" y="128" font-size="20" fill="#214c43" text-anchor="end">U</text>
<rect x="100" y="320" width="160" height="90" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="180.0" y="445" font-size="22" fill="#214c43" text-anchor="middle">Δt₁</text>
<text x="180.0" y="302" font-size="22" fill="#214c43" text-anchor="middle">U1</text>
<rect x="260" y="215" width="320" height="195" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="420.0" y="445" font-size="22" fill="#214c43" text-anchor="middle">Δt₂</text>
<text x="420.0" y="197" font-size="22" fill="#214c43" text-anchor="middle">U2</text>
<rect x="580" y="275" width="320" height="135" fill="url(#fluid)" stroke="#214c43" stroke-width="1.6"/>
<text x="740.0" y="445" font-size="22" fill="#214c43" text-anchor="middle">Δt₃</text>
<text x="740.0" y="257" font-size="22" fill="#214c43" text-anchor="middle">U3</text>
<text x="545" y="120" font-size="24" fill="#214c43" text-anchor="middle">平均值 = (U₁Δt₁ + U₂Δt₂ + U₃Δt₃) / (Δt₁ + Δt₂ + Δt₃)</text>
<text x="32" y="536" font-size="20" fill="#587169" text-anchor="start">时间步不等时，三帧算术平均与时间平均通常不同。</text>
</g></svg>
