<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"><title>在激波两侧取平台状态</title><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#be6648" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="20" fill="#f5f4eb"/><g font-family="Microsoft YaHei,sans-serif"><text x="380" y="43" font-size="25" text-anchor="middle" fill="#294f49">在激波两侧取平台状态</text><path d="M80 286H680M80 286V95" fill="none" stroke="#294f49" stroke-width="3"/><path d="M105 160H370L393 250H650" fill="none" stroke="#448998" stroke-width="4"/><path d="M382 112V281" fill="none" stroke="#be6648" stroke-width="2" stroke-dasharray="6 5"/><text x="190" y="135" font-size="19" text-anchor="middle" fill="#294f49">波后压力平台</text><text x="550" y="230" font-size="19" text-anchor="middle" fill="#294f49">波前压力平台</text><path d="M410 122L500 122" fill="none" stroke="#be6648" stroke-width="3" marker-end="url(#head)"/><text x="565" y="128" font-size="19" text-anchor="middle" fill="#294f49">激波向右</text><circle cx="260" cy="160" r="5" fill="#be6648" stroke="#be6648" stroke-width="3"/><circle cx="550" cy="250" r="5" fill="#be6648" stroke="#be6648" stroke-width="3"/><text x="380" y="330" font-size="21" text-anchor="middle" fill="#294f49">在两侧平坦区取值，并记录同一输出时刻</text><text x="49" y="121" font-size="17" text-anchor="middle" fill="#294f49">压力</text><text x="684" y="312" font-size="17" text-anchor="middle" fill="#294f49">位置</text></g></svg>