<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"><title>探针距离与冲击到达顺序</title><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#be6648" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="20" fill="#f5f4eb"/><g font-family="Microsoft YaHei,sans-serif"><text x="380" y="43" font-size="25" text-anchor="middle" fill="#294f49">探针距离与冲击到达顺序</text><circle cx="290" cy="204" r="82" fill="none" stroke="#be6648" stroke-width="3" stroke-dasharray="6 5"/><circle cx="290" cy="204" r="18" fill="#efb27b" stroke="#be6648" stroke-width="3"/><path d="M290 204H448" fill="none" stroke="#839c93" stroke-width="1" stroke-dasharray="5 4"/><circle cx="402" cy="204" r="5" fill="#294f49" stroke="#294f49" stroke-width="3"/><circle cx="430" cy="204" r="5" fill="#294f49" stroke="#294f49" stroke-width="3"/><path d="M402 197L484 127M430 211L490 269" fill="none" stroke="#294f49" stroke-width="1"/><text x="585" y="121" font-size="20" text-anchor="middle" fill="#294f49">近探针：r = 0.20</text><text x="585" y="283" font-size="20" text-anchor="middle" fill="#294f49">远探针：r = 0.25</text><path d="M313 140L342 107" fill="none" stroke="#be6648" stroke-width="3" marker-end="url(#head)"/><text x="380" y="349" font-size="21" text-anchor="middle" fill="#294f49">同一波前先到达近探针，再到达远探针</text></g></svg>