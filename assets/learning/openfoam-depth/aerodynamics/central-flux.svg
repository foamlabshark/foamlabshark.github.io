<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"><title>激波附近的面值重构</title><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#be6648" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="20" fill="#f5f4eb"/><g font-family="Microsoft YaHei,sans-serif"><text x="380" y="43" font-size="25" text-anchor="middle" fill="#294f49">激波附近的面值重构</text><rect x="80" y="118" width="270" height="135" fill="#d7e8e4" stroke="#71928a" stroke-width="2"/><rect x="350" y="118" width="270" height="135" fill="#f1dfc0" stroke="#71928a" stroke-width="2"/><path d="M350 98V275" fill="none" stroke="#be6648" stroke-width="4"/><text x="212" y="162" font-size="19" text-anchor="middle" fill="#294f49">左侧单元</text><text x="485" y="162" font-size="19" text-anchor="middle" fill="#294f49">右侧单元</text><circle cx="212" cy="210" r="5" fill="#294f49" stroke="#294f49" stroke-width="3"/><circle cx="485" cy="210" r="5" fill="#294f49" stroke="#294f49" stroke-width="3"/><path d="M224 210L322 210" fill="none" stroke="#be6648" stroke-width="3" marker-end="url(#head)"/><path d="M474 210L381 210" fill="none" stroke="#be6648" stroke-width="3" marker-end="url(#head)"/><text x="212" y="287" font-size="19" text-anchor="middle" fill="#294f49">从左侧重构面值</text><text x="500" y="287" font-size="19" text-anchor="middle" fill="#294f49">从右侧重构面值</text><text x="350" y="93" font-size="19" text-anchor="middle" fill="#294f49">同一个公共面</text><text x="380" y="340" font-size="20" text-anchor="middle" fill="#294f49">按波的传播速度构造通量；减小时间步检查波前</text></g></svg>