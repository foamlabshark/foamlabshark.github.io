<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"><title>气体初始状态与物性</title><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#be6648" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="20" fill="#f5f4eb"/><g font-family="Microsoft YaHei,sans-serif"><text x="380" y="43" font-size="25" text-anchor="middle" fill="#294f49">气体初始状态与物性</text><rect x="75" y="95" width="235" height="190" fill="#d7e8e4" stroke="#71928a" stroke-width="2"/><text x="192" y="132" font-size="19" text-anchor="middle" fill="#294f49">同一份气体</text><circle cx="105" cy="164" r="4" fill="#448998" stroke="#448998" stroke-width="3"/><circle cx="143" cy="214" r="4" fill="#448998" stroke="#448998" stroke-width="3"/><circle cx="227" cy="180" r="4" fill="#448998" stroke="#448998" stroke-width="3"/><circle cx="275" cy="247" r="4" fill="#448998" stroke="#448998" stroke-width="3"/><circle cx="110" cy="263" r="4" fill="#448998" stroke="#448998" stroke-width="3"/><circle cx="187" cy="242" r="4" fill="#448998" stroke="#448998" stroke-width="3"/><circle cx="264" cy="144" r="4" fill="#448998" stroke="#448998" stroke-width="3"/><text x="507" y="128" font-size="21" text-anchor="middle" fill="#294f49">p：单位面积的法向作用力</text><text x="507" y="173" font-size="21" text-anchor="middle" fill="#294f49">T：气体冷热的状态</text><text x="507" y="218" font-size="21" text-anchor="middle" fill="#294f49">ρ：单位体积中的质量</text><text x="380" y="336" font-size="22" text-anchor="middle" fill="#294f49">理想气体：ρ = p / (R T)，三者必须相容</text></g></svg>