<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"><title>来流、斜面与斜激波</title><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#be6648" stroke-width="1.5"/></marker></defs><rect width="760" height="390" rx="20" fill="#f5f4eb"/><g font-family="Microsoft YaHei,sans-serif"><text x="380" y="43" font-size="25" text-anchor="middle" fill="#294f49">来流、斜面与斜激波</text><path d="M92 294H285L662 207L662 306H92Z" fill="#d4d7bf" stroke="#71928a" stroke-width="2"/><path d="M285 294L624 80" fill="none" stroke="#be6648" stroke-width="4"/><path d="M285 294H640" fill="none" stroke="#839c93" stroke-width="1" stroke-dasharray="6 4"/><path d="M94 202L248 202" fill="none" stroke="#be6648" stroke-width="3" marker-end="url(#head)"/><path d="M400 225L524 196" fill="none" stroke="#be6648" stroke-width="3" marker-end="url(#head)"/><text x="164" y="173" font-size="19" text-anchor="middle" fill="#294f49">超声速来流</text><text x="526" y="98" font-size="19" text-anchor="middle" fill="#294f49">斜激波</text><text x="577" y="282" font-size="19" text-anchor="middle" fill="#294f49">固体斜面</text><text x="540" y="217" font-size="19" text-anchor="middle" fill="#294f49">波后气流转弯</text><text x="380" y="350" font-size="21" text-anchor="middle" fill="#294f49">斜面使气流转向；激波位于斜面上方</text></g></svg>