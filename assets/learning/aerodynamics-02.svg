<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#b8dee7"/><stop offset="1" stop-color="#73b3c7"/></linearGradient><linearGradient id="thermal"><stop stop-color="#dc8361"/><stop offset="1" stop-color="#83bdd0"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3 L0 6" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
