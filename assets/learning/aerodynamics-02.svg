<path d="M32 450H928M32 478H928" stroke="#e5e7dd" fill="none"/>
<text x="48" y="52" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#294f49" text-anchor="start">气体穿过正激波</text>
<rect x="110" y="182" width="731" height="199" rx="0" fill="#deedf0" stroke="#294f49" stroke-width="3"/>
