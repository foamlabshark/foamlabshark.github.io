<text x="283" y="130" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#294f49" text-anchor="middle">上游：超声速</text>
<text x="663" y="130" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#294f49" text-anchor="middle">下游：亚声速</text>
