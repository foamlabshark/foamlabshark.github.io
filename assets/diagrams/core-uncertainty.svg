.tag{font-size:12px;fill:#9aa59f}.c{text-anchor:middle}.e{text-anchor:end}.w{fill:#fff}</style><rect x="1" y="1" width="958" height="498" rx="20" fill="#fbfaf6" stroke="#d9ddd3" stroke-width="1.5"/><text x="36.0" y="54.0" class="h">误差的四种来源</text><rect x="50.0" y="110.0" width="420.0" height="150.0" rx="16" fill="#e2edf8" stroke="none" stroke-width="1.5"/><rect x="50" y="110" width="6" height="150" rx="3" fill="#3b78b5"/><text x="78.0" y="154.0" class="h" style="fill:#3b78b5;font-size:22px">离散误差</text><text x="78.0" y="190.0" class="t" style="font-size:17px">网格、时间步、离散格式</text><text x="78.0" y="224.0" class="s">→ 系统加密，看目标量变化</text><rect x="490.0" y="110.0" width="420.0" height="150.0" rx="16" fill="#fbeed8" stroke="none" stroke-width="1.5"/><rect x="490" y="110" width="6" height="150" rx="3" fill="#c98a2b"/><text x="518.0" y="154.0" class="h" style="fill:#c98a2b;font-size:22px">模型误差</text><text x="518.0" y="190.0" class="t" style="font-size:17px">湍流、界面、物性、简化几何</text><text x="518.0" y="224.0" class="s">→ 换模型或对照实验</text><rect x="50.0" y="280.0" width="420.0" height="150.0" rx="16" fill="#e4efe8" stroke="none" stroke-width="1.5"/><rect x="50" y="280" width="6" height="150" rx="3" fill="#2c6e5a"/><text x="78.0" y="324.0" class="h" style="fill:#2c6e5a;font-size:22px">输入不确定性</text><text x="78.0" y="360.0" class="t" style="font-size:17px">流量、尺寸、材料参数</text><text x="78.0" y="394.0" class="s">→ 参数扰动、敏感性分析</text><rect x="490.0" y="280.0" width="420.0" height="150.0" rx="16" fill="#ddefed" stroke="none" stroke-width="1.5"/><rect x="490" y="280" width="6" height="150" rx="3" fill="#2f8a86"/><text x="518.0" y="324.0" class="h" style="fill:#2f8a86;font-size:22px">实验不确定性</text><text x="518.0" y="360.0" class="t" style="font-size:17px">标定、分辨率、重复性</text><text x="518.0" y="394.0" class="s">→ 查看数据的误差棒</text><text x="480.0" y="466.0" class="s" text-anchor="middle">“和实验对不上”可能来自任何一项；先分清来源，再决定改哪里</text><text x="932.0" y="480.0" class="tag" text-anchor="end">FoamLab 示意图</text></svg>