"#66756f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="405.0" y="272.0" class="m" style="fill:#66756f;">d</text><rect x="600.0" y="130.0" width="320.0" height="300.0" rx="12" fill="#ffffff" stroke="#d9ddd3" stroke-width="1.5"/><text x="620.0" y="166.0" class="tb">1. 对控制体 P 积分</text><text x="620.0" y="196.0" class="mb" style="fill:#2c6e5a;">∫∇·U dV = ∮U·dS</text><text x="620.0" y="246.0" class="tb">2. 体积分变成面通量之和</text><text x="620.0" y="276.0" class="mb" style="fill:#2c6e5a;">Σ_f S_f·U_f = 0</text><text x="620.0" y="326.0" class="tb">3. 面值由相邻单元插值</text><text x="620.0" y="356.0" class="mb" style="fill:#2c6e5a;">U_f ≈ w U_P + (1−w) U_E</text><text x="620.0" y="400.0" class="s">相邻单元共享一个面：P 流出的</text><text x="620.0" y="422.0" class="s">就是 E 流入的，守恒自然成立。</text><text x="932.0" y="480.0" class="tag" text-anchor="end">FoamLab 示意图</text></svg>